<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty-state{width:100%;height:100%;display:grid;place-items:center;color:#5b6171;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.38);border:1px dashed rgba(16,20,111,.18);border-radius:14px;padding:8px}.tiny-error{color:#9f1239;font-size:10px;font-weight:800;white-space:pre-wrap}

.phish-card,.ppp-card,.train-card,.uptime-card{width:100%;height:100%;min-height:120px;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 90% 12%,rgba(188,237,22,.26),transparent 30%),linear-gradient(135deg,rgba(255,255,255,.82),rgba(226,230,236,.76));border:1px solid rgba(16,20,111,.14);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 10px 24px rgba(16,20,111,.12);padding:8px 9px;overflow:hidden;color:#10146F}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.title{font-size:12.5px;font-weight:900;color:#10146F;line-height:1;white-space:nowrap}.pill{font-size:9px;font-weight:900;color:#10146F;background:rgba(255,255,255,.62);border:1px solid rgba(16,20,111,.10);border-radius:999px;padding:3px 7px;white-space:nowrap}.momrows,.bars{display:flex;flex-direction:column;gap:5px}.momrow,.barrow{display:grid;grid-template-columns:75px 1fr 38px;gap:6px;align-items:center;background:rgba(255,255,255,.44);border-radius:9px;padding:5px 6px}.lab,.dept{font-size:8.5px;color:#65697B;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mv,.pct{font-size:10px;font-weight:950;color:#10146F;text-align:right}.track{height:9px;background:rgba(16,20,111,.09);border-radius:999px;overflow:hidden;position:relative}.bar{height:100%;border-radius:999px;background:#0808EE}.target{position:absolute;top:-2px;width:2px;height:13px;background:#D64550}.kpiLine{display:flex;align-items:center;gap:8px;margin:2px 0 7px}.big{font-size:24px;line-height:1;font-weight:950;color:#10146F}.tag{font-size:9px;font-weight:950;border:1px solid #09C698;border-radius:999px;padding:3px 7px;background:rgba(255,255,255,.55)}.top{display:grid;grid-template-columns:74px 1fr;gap:7px;align-items:center;margin-bottom:4px}.ppp{background:rgba(255,255,255,.58);border:1px solid rgba(16,20,111,.09);border-radius:11px;padding:6px 7px}.val{font-size:20px;font-weight:950;color:#10146F;line-height:1}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.m{background:rgba(255,255,255,.50);border-radius:9px;padding:5px 6px;border:1px solid rgba(16,20,111,.07)}.chartwrap{height:104px;display:grid;grid-template-columns:24px 1fr;gap:4px;border-top:1px solid rgba(16,20,111,.10);margin-top:5px;padding-top:5px;position:relative}.yaxis{height:92px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding-right:3px;color:#65697B;font-size:8px;font-weight:800;line-height:1}.plot{height:92px;display:flex;align-items:flex-end;justify-content:space-around;gap:4px;position:relative;background:linear-gradient(to top, rgba(16,20,111,.08) 1px, transparent 1px) 0 100%/100% 50% no-repeat}.mcol{height:92px;flex:1;position:relative;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;z-index:4}.mbar{width:45%;min-width:7px;border-radius:7px 7px 0 0;overflow:hidden;background:#DBE1EA}.mbar div{width:100%}.pppdot{position:absolute;width:6px;height:6px;border-radius:50%;background:#10146F;box-shadow:0 0 0 3px rgba(16,20,111,.12);left:50%;transform:translateX(-50%);z-index:5}.mlab{font-size:7px;font-weight:850;color:#65697B;margin-top:3px;white-space:nowrap}.legend,.foot{font-size:8px;font-weight:850;color:#65697B;display:flex;justify-content:space-between;gap:8px;margin-top:4px}.svc{display:grid;grid-template-columns:1fr 44px;gap:7px;align-items:center;margin:5px 0}.svcname{font-size:9px;font-weight:850;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.svcval{font-size:9px;font-weight:950;text-align:right;color:#10146F}
</style></head><body><div id="root"><div class="empty-state">Waiting for live data...</div></div><script>
const ITS = (() => {
  const nf0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const rowsOf = p => Array.isArray(p?.data) ? p.data : Array.isArray(p?.result?.data) ? p.result.data : Array.isArray(p?.payload?.data) ? p.payload.data : [];
  const key = (row, names) => { if (!row) return ''; const m={}; Object.keys(row).forEach(k => m[k.toLowerCase()] = k); for (const n of names) { const hit = m[String(n).toLowerCase()]; if (hit) return hit; } return ''; };
  const txt = (row, names, fb='') => { const k = key(row,names); const v = k ? row[k] : fb; return (v === null || v === undefined) ? fb : String(v); };
  const num = (v, fb=0) => { if (v === null || v === undefined || v === '') return fb; if (typeof v === 'number') return Number.isFinite(v) ? v : fb; const n = Number(String(v).replace(/,/g,'').replace(/%/g,'')); return Number.isFinite(n) ? n : fb; };
  const val = (row, names, fb=0) => { const k = key(row,names); return k ? num(row[k], fb) : fb; };
  const pctText = (v, d=1, signed=true) => { let n = num(v,0); if (Math.abs(n) <= 1.5) n *= 100; const s = signed && n > 0 ? '+' : ''; return s + n.toFixed(d) + '%'; };
  const pctPlain = (v, d=1) => { let n = num(v,0); if (Math.abs(n) <= 1.5) n *= 100; return n.toFixed(d) + '%'; };
  const month = v => { if (!v) return ''; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString(undefined,{month:'long',year:'numeric'}); };
  const monShort = v => { if (!v) return ''; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString(undefined,{month:'short'}); };
  const colorFor = label => { const s=String(label||'').toLowerCase(); if(s.includes('high')) return '#D64550'; if(s.includes('medium')) return '#E6B422'; if(s.includes('low')) return '#09C698'; if(s.includes('open')) return '#0808EE'; if(s.includes('closed')) return '#09C698'; if(s.includes('fail') && !s.includes('soft')) return '#D64550'; if(s.includes('soft')) return '#E6B422'; if(s.includes('pass')||s.includes('met')||s.includes('remediated')) return '#09C698'; return '#4F63F7'; };
  const sum = (rows, names) => rows.reduce((a,r)=>a+val(r,names,0),0);
  const max = xs => xs.reduce((a,b)=>Math.max(a,b),0);
  const root = () => document.getElementById('root');
  const empty = (msg='No live data.') => { root().innerHTML = `<div class="empty-state">${esc(msg)}</div>`; };
  return {nf0,nf1,nf2,esc,rowsOf,key,txt,num,val,pctText,pctPlain,month,monShort,colorFor,sum,max,root,empty};
})();
function receiveDashboard(render){
  window.addEventListener('message', e => {
    if(!e.data || !String(e.data.type||'').startsWith('dashboard-custom-html:')) return;
    if(String(e.data.type||'').endsWith(':resize')) return;
    render(e.data.payload || e.data || {});
  });
  if(window.__ITS_PREVIEW_PAYLOAD__) render(window.__ITS_PREVIEW_PAYLOAD__);
}

function render(payload){const rows=ITS.rowsOf(payload); if(!rows.length) return ITS.empty('No KnowBe4 phishing trend rows.'); const month=ITS.month(ITS.txt(rows[0],['month_start','MonthStart','CurrentPeriod'],'')); const mx=ITS.max(rows.map(r=>ITS.val(r,['failure_count','CurrentCount','Count'],0))); const body=rows.map(r=>{const label=ITS.txt(r,['failure_type','FailureType','Type'],'Failure'); const c=ITS.val(r,['failure_count','CurrentCount','Count'],0), p=ITS.val(r,['prior_month_count','PriorCount','Prior'],0), d=c-p; return `<div class="momrow"><div class="lab" title="${ITS.esc(label)}">${ITS.esc(label)}</div><div class="track"><div class="bar" style="width:${mx?Math.max(4,c/mx*100):0}%;background:${d>0?'#D64550':'#09C698'}"></div></div><div class="mv">${ITS.nf0.format(c)} ${d?`(${d>0?'+':''}${d})`:''}</div></div>`}).join(''); ITS.root().innerHTML=`<div class="phish-card"><div class="head"><div class="title">Phishing Failure MoM</div><div class="pill">${ITS.esc(month||'Latest')}</div></div><div class="momrows">${body}</div><div class="foot"><span>Current vs prior month</span><span>KnowBe4</span></div></div>`;}
receiveDashboard(render);
</script></body></html>
