<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#171777;--header:#171777;--grid:#d7daea;--body:#f7f7fb;--alt:#ffffff;--white:#fff;
  --neg:#09C698;--pos:#ff2a2a;--muted:#6d7590;--border:#d5d7e0;
  --b0:#0808EE;--b1:#09C698;--b2:#4F63F7;--b3:#BBFF05;--line:#635BCB;--total:#DDF76D;
}
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,Helvetica,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
.tile{width:100%;height:100%;background:#fff;border:1px solid var(--border);border-radius:10px;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
.head{padding:7px 10px 3px}
.title{font-size:12px;line-height:1.1;font-weight:900}
.subtitle{font-size:10px;font-weight:800;color:#59617d;margin-top:3px}
.table-wrap{overflow:hidden}
.chart-wrap{min-height:0;padding:4px 8px 6px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid var(--grid);padding:6px 8px;font-size:10.5px;line-height:1.05;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th{background:var(--header);color:var(--white);font-weight:900}
thead th:first-child{width:31%;text-align:left}
tbody td{background:var(--body)}
tbody tr:nth-child(even) td{background:var(--alt)}
tbody td:first-child{text-align:left;font-weight:900}
.total-cell{font-weight:900;color:var(--neg)}
svg{width:100%;height:100%;min-height:145px}
.legend{font-size:9px;fill:var(--ink);font-weight:700}
.axis{stroke:#c9c9d9;stroke-width:1}
.state{width:100%;height:100%;display:grid;place-items:center;background:#fff}
.state-inner{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--muted);max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin{width:10px;height:10px;border:2px solid #d9dbe6;border-top-color:var(--ink);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{width:100%;height:100%;background:#fff7f7;color:#9b1c1c;padding:8px;overflow:auto;font-size:10px;line-height:1.35;font-weight:700;white-space:pre-wrap}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
let gotData=false;
const BUCKETS=[
  {key:"0_30", label:"0-30", aliases:["0_30","Bucket_0_30","Bucket0_30","Bucket_030","0-30","0 - 30"]},
  {key:"31_60", label:"31-60", aliases:["31_60","Bucket_31_60","Bucket31_60","31-60","31 - 60"]},
  {key:"61_90", label:"61-90", aliases:["61_90","Bucket_61_90","Bucket61_90","61-90","61 - 90"]},
  {key:"90_plus", label:"90+", aliases:["90_plus","90_Plus","Bucket_90_Plus","Bucket_90_plus","Bucket90Plus","90+","90 Plus",">90","Over 90"]}
];
const COLORS=["#0808EE","#09C698","#4F63F7","#BBFF05"];

function root(){return document.getElementById("root")}
function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function showLoader(t){root().innerHTML='<div class="state"><div class="state-inner"><span class="spin"></span><span>'+esc(t||"loading")+'</span></div></div>'}
function showNoData(t){root().innerHTML='<div class="state"><div class="state-inner"><span>'+esc(t||"no data")+'</span></div></div>'}
function showError(e){root().innerHTML='<div class="error-box">'+esc(e&&e.stack?e.stack:String(e||"Unknown error"))+'</div>'}
function parseMaybeJson(v){if(typeof v!=="string")return v;const s=v.trim();if(!s||("[".indexOf(s[0])<0&&"{".indexOf(s[0])<0))return v;try{return JSON.parse(s)}catch{return v}}
function ciGet(r,n){if(!r||typeof r!=="object")return undefined;const t=String(n).toLowerCase();for(const k of Object.keys(r)){if(String(k).toLowerCase()===t)return r[k]}return undefined}
function first(r,names){for(const name of names){const v=ciGet(r,name); if(v!==undefined) return v;} return undefined;}
function n(v){if(typeof v==="number")return Number.isFinite(v)?v:0;const x=Number(String(v??"").replace(/[$,%\s,]/g,""));return Number.isFinite(x)?x:0}
function isNil(v){return v===null||v===undefined||v===""}
function hasBucketWide(r){return r&&typeof r==="object"&&(BUCKETS.some(b=>first(r,b.aliases)!==undefined)||ciGet(r,"TotalAR")!==undefined||ciGet(r,"Total AR")!==undefined)}
function hasBucketTall(r){return r&&typeof r==="object"&&ciGet(r,"AgingBucket")!==undefined&&ciGet(r,"Amount")!==undefined}
function looks(r){return (hasBucketWide(r)||hasBucketTall(r))&&(ciGet(r,"PeriodDate")!==undefined||ciGet(r,"SelectedDate")!==undefined||ciGet(r,"CurrentDate")!==undefined)}
function isRows(v){return Array.isArray(v)&&v.length&&v.some(looks)}
function findRows(v,d,s){
  d=d||0;s=s||[];v=parseMaybeJson(v);
  if(isRows(v))return v;
  if(!v||typeof v!=="object"||d>16)return[];
  if(s.includes(v))return[];s.push(v);
  for(const k of["data","rows","records","items","payload","model","result","response","body","raw","source","detail","value","values","context"]){
    if(Object.prototype.hasOwnProperty.call(v,k)){const f=findRows(v[k],d+1,s);if(f.length)return f}
  }
  for(const k of Object.keys(v)){const f=findRows(v[k],d+1,s);if(f.length)return f}
  return[]
}
function findContext(v,d,s){
  d=d||0;s=s||[];v=parseMaybeJson(v);
  if(!v||typeof v!=="object"||d>10)return{};
  if(s.includes(v))return{};s.push(v);
  if(ciGet(v,"title")||ciGet(v,"label")||ciGet(v,"key")||ciGet(v,"filters"))return v;
  for(const k of["config","widget","payload","model","context","request"]){if(v[k]){const c=findContext(v[k],d+1,s);if(Object.keys(c).length)return c}}
  return{}
}
function dateObj(raw){if(!raw)return null;const s=String(raw).trim();const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);return Number.isFinite(d.getTime())?new Date(d.getFullYear(),d.getMonth(),d.getDate()):null}
function keyDate(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:""}
function mmddyyyy(d){return d?`${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}/${d.getFullYear()}`:""}
function money(v){if(isNil(v))return"—";const x=n(v),a=Math.abs(x),sg=x<0?"-":"";if(a>=1e6)return sg+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.0$/,"")+"M";if(a>=1e3)return sg+Math.round(a/1e3).toLocaleString("en-US")+"K";return sg+Math.round(a).toLocaleString("en-US")}
function normBucket(v){let s=String(v??"").trim().replace(/&gt;/gi,">").replace(/\\u003e/gi,">").toLowerCase();if(["0-30","0_30","0 to 30","0 – 30"].includes(s))return"0_30";if(["31-60","31_60","31 to 60"].includes(s))return"31_60";if(["61-90","61_90","61 to 90"].includes(s))return"61_90";if([">90","90+","91+","over 90","90 plus"].includes(s))return"90_plus";return""}

function sortPeriods(arr){
  return arr.sort((a,b)=>{
    const ao = Number(a.sortOrder ?? 999);
    const bo = Number(b.sortOrder ?? 999);
    if(Number.isFinite(ao) && Number.isFinite(bo) && ao !== bo) return ao - bo;
    return a.date - b.date;
  });
}

function buildModel(rows){
  const by=new Map();
  for(const r of rows){
    const d=dateObj(ciGet(r,"PeriodDate")??ciGet(r,"SelectedDate")??ciGet(r,"CurrentDate"));
    if(!d)continue;
    const k=keyDate(d);
    if(!by.has(k))by.set(k,{
      date:d,
      sortOrder:ciGet(r,"SortOrder"),
      periodKey:ciGet(r,"PeriodKey"),
      periodLabel:ciGet(r,"PeriodLabel"),
      v:{"0_30":0,"31_60":0,"61_90":0,"90_plus":0},
      totalFromRows:0,
      totalSeen:false,
      bucketSeen:false
    });
    const e=by.get(k);
    if(e.sortOrder===undefined) e.sortOrder=ciGet(r,"SortOrder");
    if(!e.periodKey) e.periodKey=ciGet(r,"PeriodKey");
    if(!e.periodLabel) e.periodLabel=ciGet(r,"PeriodLabel");

    if(hasBucketTall(r)){
      const b=normBucket(ciGet(r,"AgingBucket"));
      if(b){e.v[b]+=n(ciGet(r,"Amount")); e.bucketSeen=true;}
    } else {
      for(const b of BUCKETS){
        const val=first(r,b.aliases);
        if(!isNil(val)){e.v[b.key]+=n(val); e.bucketSeen=true;}
      }
    }

    const total=ciGet(r,"TotalAR")??ciGet(r,"Total AR")??ciGet(r,"Total");
    if(!isNil(total)){e.totalFromRows+=n(total); e.totalSeen=true;}
  }

  let arr=Array.from(by.values());
  arr.forEach(e=>{
    e.bucketTotal=BUCKETS.reduce((s,b)=>s+n(e.v[b.key]),0);
    e.total=e.bucketTotal!==0 ? e.bucketTotal : (e.totalSeen ? e.totalFromRows : 0);
    // If the SQL view has not populated buckets yet, still render a visible total-only bar.
    // This prevents "no graph" while making the table reveal that the bucket columns are zero.
    e.totalOnly = e.bucketTotal === 0 && e.totalSeen && e.totalFromRows !== 0;
  });
  arr=sortPeriods(arr).filter(x=>x.bucketSeen||x.totalSeen).slice(-6);
  if(arr.some(x=>String(x.periodKey||"").toUpperCase()==="CURRENT")){
    const currentIndex=arr.findIndex(x=>String(x.periodKey||"").toUpperCase()==="CURRENT");
    arr.forEach((x,i)=>x.isToday=i===currentIndex);
  } else {
    arr.forEach((x,i)=>x.isToday=i===arr.length-1);
  }
  return arr;
}

function getTitle(ctx,rows){const t=ciGet(ctx,"title")||ciGet(ctx,"label");if(t)return String(t);const cg=ciGet(rows[0]||{},"CategoryGroup");return String(cg||"").toLowerCase().includes("commercial")?"Commercial Buckets":"Residential Buckets"}
function getSubtitle(title){const cls=String(title).toLowerCase().includes("commercial")?"Commercial":"Residential";return cls+" AR - WoW by Aging Buckets - Active, True Debt"}

function rowLabel(p){
  const pl=String(p.periodLabel||"").trim();
  if(pl && !/^today$/i.test(pl) && !/^current$/i.test(pl) && !/^previous week$/i.test(pl)) return pl+" ("+mmddyyyy(p.date)+")";
  return (p.isToday?"Today’s date":"Prev week")+" ("+mmddyyyy(p.date)+")";
}

function chart(model){
  const w=640,h=190,l=45,b=30,t=12,plotH=h-b-t,max=Math.max(1,...model.map(x=>Math.abs(x.total)))*1.15,barW=28,gap=34;
  let html=`<svg viewBox="0 0 ${w} ${h}"><line class="axis" x1="${l}" y1="${h-b}" x2="${w-120}" y2="${h-b}"/><line class="axis" x1="${l}" y1="${t}" x2="${l}" y2="${h-b}"/>`;
  model.forEach((p,i)=>{
    const x=l+32+i*(barW+gap); let y=h-b;
    if(p.totalOnly){
      const bh=Math.abs(n(p.total))/max*plotH; y-=bh;
      html+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="#DDF76D" opacity="0.95"/>`;
    } else {
      BUCKETS.forEach((b,j)=>{const bh=Math.abs(n(p.v[b.key]))/max*plotH;y-=bh;html+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${COLORS[j]}"/>`});
    }
    html+=`<text x="${x-7}" y="${h-8}" font-size="9" fill="#171777">${esc(mmddyyyy(p.date).slice(0,5))}</text>`;
  });
  const pts=model.map((p,i)=>{const x=l+32+i*(barW+gap)+barW/2;const y=h-b-(Math.abs(n(p.total))/max*plotH);return `${x},${y}`}).join(" ");
  if(pts) html+=`<polyline points="${pts}" fill="none" stroke="#635BCB" stroke-width="3"/>`;
  model.forEach((p,i)=>{const x=l+32+i*(barW+gap)+barW/2;const y=h-b-(Math.abs(n(p.total))/max*plotH);html+=`<circle cx="${x}" cy="${y}" r="3" fill="#635BCB"/>`});
  let lx=w-112,ly=22;
  BUCKETS.forEach((b,j)=>{html+=`<rect x="${lx}" y="${ly+j*16}" width="9" height="9" fill="${COLORS[j]}"/><text class="legend" x="${lx+14}" y="${ly+8+j*16}">${esc(b.label)}</text>`});
  html+=`<rect x="${lx}" y="${ly+64}" width="9" height="9" fill="#DDF76D"/><text class="legend" x="${lx+14}" y="${ly+72}">Total only</text>`;
  html+=`<line x1="${lx}" y1="${ly+88}" x2="${lx+10}" y2="${ly+88}" stroke="#635BCB" stroke-width="3"/><text class="legend" x="${lx+14}" y="${ly+91}">Total</text></svg>`;
  return html;
}

function draw(source){
  try{
    const rows=findRows(source);
    if(!rows.length){if(!gotData)showNoData("no data");return}
    const ctx=findContext(source),title=getTitle(ctx,rows),model=buildModel(rows);
    if(!model.length)throw new Error("No renderable bucket periods. Rows found: "+rows.length);
    let html='<div class="tile"><div class="head"><div class="title">'+esc(title)+'</div><div class="subtitle">'+esc(getSubtitle(title))+'</div></div><div class="table-wrap"><table><thead><tr><th>Week</th><th>0-30</th><th>31-60</th><th>61-90</th><th>90+</th><th>Total AR</th></tr></thead><tbody>';
    model.forEach(p=>{
      html+='<tr><td>'+esc(rowLabel(p))+'</td>';
      BUCKETS.forEach(b=>html+='<td>'+esc(money(p.v[b.key]))+'</td>');
      html+='<td class="total-cell">'+esc(money(p.total))+'</td></tr>';
    });
    html+='</tbody></table></div><div class="chart-wrap">'+chart(model)+'</div></div>';
    root().innerHTML=html; gotData=true;
  }catch(e){showError(e)}
}
function receive(source){
  try{
    const rows=findRows(source);
    if(rows.length){draw(source);return}
    if(gotData)return;
    const v=parseMaybeJson(source);
    if(v&&typeof v==="object"&&(Array.isArray(v.data)&&v.data.length===0||Array.isArray(v.rows)&&v.rows.length===0))showNoData("no data")
  }catch(e){showError(e)}
}
showLoader("loading");
window.addEventListener("message",ev=>{const data=ev&&ev.data?ev.data:{};const type=String(data.type||"");if(type.startsWith("dashboard-custom-html:")&&type.endsWith(":resize"))return;receive(data)});
window.update=receive; window.init=receive; window.setData=receive; window.onData=receive; window.drawArBuckets=receive;
if(window.DashVisualContext)receive(window.DashVisualContext);else if(window.__DashVisualContext)receive(window.__DashVisualContext);else if(window.__DASH_VISUAL_CONTEXT__)receive(window.__DASH_VISUAL_CONTEXT__);
})();
</script></body></html>
