
<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: Segoe UI,Tahoma,Arial,sans-serif;
            color: #10146F
        }

        * {
            box-sizing: border-box
        }

        .empty-state {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            color: #5b6171;
            font-size: 10px;
            font-weight: 850;
            text-align: center;
            background: rgba(255,255,255,.38);
            border: 1px dashed rgba(16,20,111,.18);
            border-radius: 14px;
            padding: 8px
        }

        .tiny-error {
            color: #9f1239;
            font-size: 10px;
            font-weight: 800;
            white-space: pre-wrap
        }

        .priority-shell, .closed-priority-shell, .status-shell,
        .priority-shell *, .closed-priority-shell *, .status-shell * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision
        }

        .priority-shell, .closed-priority-shell, .status-shell {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            min-width: 0;
            min-height: 0;
            padding: 4px;
            overflow: hidden !important;
            font-family: Segoe UI,Tahoma,Arial,sans-serif;
            color: #142032
        }

        .priority-card, .closed-priority-card, .status-card {
            position: absolute;
            inset: 4px;
            box-sizing: border-box;
            overflow: hidden !important;
            border-radius: 18px;
            border: 1px solid #BCB8BE;
            background: radial-gradient(circle at 92% 8%, rgba(188,237,22,.14), transparent 26%),radial-gradient(circle at 8% 12%, rgba(21,18,244,.08), transparent 28%),linear-gradient(135deg, #FFFFFF, #EEF1F6);
            box-shadow: 0 8px 18px rgba(33,43,60,0.10), inset 0 1px 0 rgba(255,255,255,0.86);
            display: flex;
            align-items: stretch;
            justify-content: stretch
        }

            .priority-card::before, .closed-priority-card::before, .status-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 14px;
                right: 14px;
                height: 3px;
                border-radius: 999px;
                background: var(--top-gradient);
                box-shadow: 0 0 10px rgba(29,43,255,.16);
                z-index: 2
            }

        .priority-donut, .closed-priority-donut, .status-donut {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: block;
            transform-origin: center center;
            shape-rendering: geometricPrecision;
            text-rendering: geometricPrecision;
            overflow: hidden
        }

        .seggrp {
            cursor: pointer
        }

        .seg {
            opacity: .94;
            transition: stroke-width .18s ease,opacity .18s ease,filter .18s ease
        }

        .seggrp:hover .seg {
            stroke-width: 47;
            opacity: 1;
            filter: drop-shadow(0 5px 9px rgba(15,23,42,.18))
        }

        .leader {
            fill: none;
            stroke-width: 2.15;
            opacity: .92;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-width .18s ease,opacity .18s ease
        }

        .elbow {
            opacity: .9;
            transition: opacity .18s ease,r .18s ease
        }

        .seggrp:hover .leader {
            stroke-width: 3;
            opacity: 1
        }

        .seggrp:hover .elbow {
            opacity: 1;
            r: 3.8
        }

        .slice-label {
            fill: #0F172A;
            font-family: Segoe UI,Tahoma,Arial,sans-serif;
            font-weight: 900;
            pointer-events: none;
            paint-order: stroke;
            stroke: rgba(255,255,255,.92);
            stroke-width: 3.1px;
            stroke-linejoin: round
        }

        .label-cat {
            fill: #0F172A;
            font-weight: 950
        }

        .label-val {
            fill: #334155;
            font-weight: 950
        }

        .center-value {
            fill: #0F172A;
            font-family: Segoe UI,Tahoma,Arial,sans-serif;
            font-size: 48px;
            font-weight: 950;
            letter-spacing: -.045em;
            text-rendering: geometricPrecision
        }

        .center-label {
            fill: #475569;
            font-family: Segoe UI,Tahoma,Arial,sans-serif;
            font-size: 12px;
            font-weight: 950;
            letter-spacing: .04em;
            text-rendering: geometricPrecision
        }

        .empty-note {
            fill: #475569;
            font-family: Segoe UI,Tahoma,Arial,sans-serif;
            font-size: 18px;
            font-weight: 850
        }
    </style>
</head>

<body>
    <div id="root"><div class="empty-state">Waiting for live data...</div></div>

    <script>
/* eslint-disable no-var */

/**
 * @typedef {Record<string, any>} AnyRow
 * @typedef {{ label: string, value: number }} DonutItem
 * @typedef {{ label: string, value: number, rank: number, start: number, color: string }} DonutSegment
 * @typedef {{ lf: string, vf: string, gap: number }} LabelSetting
 * @typedef {{ duration?: number, decimals?: number, prefix?: string, suffix?: string }} RollOptions
 */

/** @type {Window & Record<string, any>} */
const ITS_WIN = /** @type {Window & Record<string, any>} */ (window);

const ITS = (() => {
  const nf0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /** @type {Record<string, string>} */
  const ESC = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  };

  /**
   * @param {unknown} v
   * @returns {string}
   */
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ESC[m] || m);

  /**
   * @param {any} p
   * @returns {AnyRow[]}
   */
  const rowsOf = p => {
    if (Array.isArray(p?.data)) return p.data;
    if (Array.isArray(p?.result?.data)) return p.result.data;
    if (Array.isArray(p?.payload?.data)) return p.payload.data;
    return [];
  };

  /**
   * @param {AnyRow | null | undefined} row
   * @param {string[]} names
   * @returns {string}
   */
  const key = (row, names) => {
    if (!row) return '';

    /** @type {Record<string, string>} */
    const m = {};

    Object.keys(row).forEach(k => {
      m[k.toLowerCase()] = k;
    });

    for (const n of names) {
      const hit = m[String(n).toLowerCase()];
      if (hit) return hit;
    }

    return '';
  };

  /**
   * @param {AnyRow | null | undefined} row
   * @param {string[]} names
   * @param {string} [fb]
   * @returns {string}
   */
  const txt = (row, names, fb = '') => {
    const k = key(row, names);
    const v = k ? row[k] : fb;
    return (v === null || v === undefined || v === '') ? fb : String(v);
  };

  /**
   * @param {unknown} v
   * @param {number} [fb]
   * @returns {number}
   */
  const num = (v, fb = 0) => {
    if (v === null || v === undefined || v === '') return fb;
    if (typeof v === 'number') return Number.isFinite(v) ? v : fb;

    const n = Number(String(v).replace(/,/g, '').replace(/%/g, ''));
    return Number.isFinite(n) ? n : fb;
  };

  /**
   * @param {AnyRow | null | undefined} row
   * @param {string[]} names
   * @param {number} [fb]
   * @returns {number}
   */
  const val = (row, names, fb = 0) => {
    const k = key(row, names);
    return k ? num(row[k], fb) : fb;
  };

  /**
   * @returns {HTMLElement}
   */
  const root = () => {
    const el = document.getElementById('root');
    if (!el) throw new Error('Missing #root element.');
    return el;
  };

  /**
   * @param {string} [msg]
   * @returns {void}
   */
  const empty = (msg = 'No live data.') => {
    root().innerHTML = `<div class="empty-state">${esc(msg)}</div>`;
  };

  return { nf0, nf1, nf2, esc, rowsOf, key, txt, num, val, root, empty };
})();

/**
 * @param {(payload: any) => void} renderFn
 * @returns {void}
 */
function receiveDashboard(renderFn) {
  window.addEventListener('message', function(e) {
    const data = /** @type {any} */ (e.data);

    if (!data || !String(data.type || '').startsWith('dashboard-custom-html:')) return;
    if (String(data.type || '').endsWith(':resize')) return;

    renderFn(data.payload || data || {});
  });

  if (ITS_WIN.__ITS_PREVIEW_PAYLOAD__) {
    renderFn(ITS_WIN.__ITS_PREVIEW_PAYLOAD__);
  }
}

ITS_WIN.__ITS_ROLL_VALUES = ITS_WIN.__ITS_ROLL_VALUES || {};

/**
 * @returns {boolean}
 */
function isExportMode() {
  const q = new URLSearchParams(window.location.search);
  const body = document.body;

  return q.get('export') === 'pdf'
      || q.get('export') === '1'
      || q.get('pdf') === '1'
      || document.documentElement.getAttribute('data-export') === 'pdf'
      || (body ? body.getAttribute('data-export') === 'pdf' : false);
}

/**
 * @param {number} v
 * @param {number} [decimals]
 * @param {string} [prefix]
 * @param {string} [suffix]
 * @returns {string}
 */
function formatRollingNumber(v, decimals = 0, prefix = '', suffix = '') {
  return prefix + new Intl.NumberFormat(undefined, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  }).format(v) + suffix;
}

/**
 * @param {Element} el
 * @param {number} nextValue
 * @param {RollOptions} [opts]
 * @returns {void}
 */
function animateNumber(el, nextValue, opts = {}) {
  const duration = opts.duration || 650;
  const decimals = opts.decimals || 0;
  const prefix = opts.prefix || '';
  const suffix = opts.suffix || '';

  const oldValue = Number(el.getAttribute('data-value') || '0');
  const newValue = Number(nextValue || 0);

  if (!Number.isFinite(newValue)) return;

  if (isExportMode() || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.setAttribute('data-value', String(newValue));
    el.textContent = formatRollingNumber(newValue, decimals, prefix, suffix);
    return;
  }

  const start = performance.now();
  const delta = newValue - oldValue;

  /**
   * @param {number} t
   * @returns {number}
   */
  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  /**
   * @param {number} now
   * @returns {void}
   */
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const v = oldValue + delta * easeOutCubic(t);

    el.textContent = formatRollingNumber(v, decimals, prefix, suffix);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      el.setAttribute('data-value', String(newValue));
      el.textContent = formatRollingNumber(newValue, decimals, prefix, suffix);
    }
  }

  requestAnimationFrame(frame);
}

/**
 * @param {string} tileKey
 * @param {Element | null} el
 * @param {number} nextValue
 * @returns {void}
 */
function rollCenterValue(tileKey, el, nextValue) {
  if (!el) return;

  const newValue = Number(nextValue || 0);
  if (!Number.isFinite(newValue)) return;

  /** @type {Record<string, number>} */
  const cache = ITS_WIN.__ITS_ROLL_VALUES;

  const oldValue = cache[tileKey];

  if (oldValue === undefined || isExportMode()) {
    cache[tileKey] = newValue;
    el.setAttribute('data-value', String(newValue));
    el.textContent = ITS.nf0.format(newValue);
    return;
  }

  if (oldValue === newValue) {
    el.setAttribute('data-value', String(newValue));
    el.textContent = ITS.nf0.format(newValue);
    return;
  }

  el.setAttribute('data-value', String(oldValue));
  el.textContent = ITS.nf0.format(oldValue);
  cache[tileKey] = newValue;

  const delta = Math.abs(newValue - oldValue);

  animateNumber(el, newValue, {
    duration: delta <= 3 ? 350 : 650,
    decimals: 0
  });
}

/**
 * @param {DonutItem[]} items
 * @returns {DonutItem[]}
 */
function sortItems(items) {
  return items.slice().sort(function(a, b) {
    return b.value - a.value || String(a.label).localeCompare(String(b.label));
  });
}

/**
 * @param {number} n
 * @returns {LabelSetting}
 */
function labelSettings(n) {
  return {
    lf: n <= 4 ? '16px' : n <= 6 ? '14.5px' : n <= 8 ? '13px' : '12px',
    vf: n <= 4 ? '16.5px' : n <= 6 ? '15px' : n <= 8 ? '13.5px' : '12.5px',
    gap: n <= 4 ? 46 : n <= 6 ? 38 : n <= 8 ? 32 : 27
  };
}

/**
 * @param {string} role
 * @param {string} label
 * @param {number} rank
 * @returns {string}
 */
function colorFor(role, label, rank) {
  const s = String(label || '').toLowerCase();

  if (role === 'status') {
    if (s.includes('open')) return '#1D2BFF';
    if (s.includes('on hold') || s.includes('hold')) return '#14C8B6';
    if (s.includes('cancel')) return '#0F172A';
    if (s.includes('customer') || s.includes('action')) return '#64748B';
    if (s.includes('closed')) return '#94A3B8';

    return ['#1D2BFF','#14C8B6','#0F172A','#64748B','#94A3B8','#F97316','#EF4444','#8B5CF6'][rank - 1] || '#8B5CF6';
  }

  if (s.includes('high')) return '#1D2BFF';
  if (s.includes('medium')) return '#14C8B6';
  if (s.includes('low')) return '#48B56B';
  if (s.includes('none') || s.includes('normal')) return '#94A3B8';

  return ['#1D2BFF','#14C8B6','#48B56B','#94A3B8','#F97316','#EF4444','#8B5CF6'][rank - 1] || '#8B5CF6';
}

/**
 * @param {DonutItem[]} items
 * @param {string} role
 * @param {number} total
 * @returns {string}
 */
function groups(items, role, total) {
  const cx = 250;
  const cy = 150;
  const r = 94;
  const stroke = 39;
  const circ = 590;
  const setting = labelSettings(items.length);

  let running = 0;

  /** @type {DonutSegment[]} */
  const segs = items.map(function(it, i) {
    const rank = i + 1;
    const start = running;
    running += it.value;

    return {
      label: it.label,
      value: it.value,
      rank,
      start,
      color: colorFor(role, it.label, rank)
    };
  });

  return segs.map(function(seg) {
    const val = seg.value;
    const pct = total ? val / total : 0;
    const pctLabel = (pct * 100).toFixed(1) + '%';
    const dash = Math.round(pct * circ);
    const gapDash = circ - dash;
    const offset = -Math.round((seg.start / Math.max(total, 1)) * circ);
    const mid = (seg.start + val / 2) / Math.max(total, 1) * 2 * Math.PI - Math.PI / 2;
    const right = Math.cos(mid) >= 0;

    const x1 = Math.round(cx + (r + 8) * Math.cos(mid));
    const y1 = Math.round(cy + (r + 8) * Math.sin(mid));
    const x2 = Math.round(cx + (r + 20) * Math.cos(mid));
    const y2 = Math.round(cy + (r + 20) * Math.sin(mid));
    const rawY = Math.round(cy + ((r + 18) * Math.sin(mid) * 0.58));

    const side = segs.filter(function(o) {
      const om = (o.start + o.value / 2) / Math.max(total, 1) * 2 * Math.PI - Math.PI / 2;
      return (Math.cos(om) >= 0) === right;
    });

    const sideRank = 1 + side.filter(function(o) {
      const om = (o.start + o.value / 2) / Math.max(total, 1) * 2 * Math.PI - Math.PI / 2;
      const oy = Math.round(cy + ((r + 18) * Math.sin(om) * 0.58));
      return oy < rawY || (oy === rawY && o.rank < seg.rank);
    }).length;

    const y3 = Math.round(cy - ((side.length - 1) * setting.gap) / 2 + (sideRank - 1) * setting.gap);
    const x3 = right ? cx + r + 24 : cx - r - 24;
    const x4 = right ? 400 : 100;
    const xt = right ? 482 : 18;
    const anchor = right ? 'end' : 'start';
    const cat = ITS.esc(seg.label);
    const formattedVal = ITS.nf0.format(val);

    return `<g class='seggrp'>
      <circle class='seg' cx='${cx}' cy='${cy}' r='${r}' fill='none' stroke='${seg.color}' stroke-width='${stroke}' stroke-linecap='butt' stroke-dasharray='${dash} ${gapDash}' stroke-dashoffset='${offset}' transform='rotate(-90 ${cx} ${cy})'>
        <title>${cat}: ${formattedVal} (${pctLabel})</title>
      </circle>
      <polyline class='leader' points='${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y3}' stroke='${seg.color}'/>
      <circle class='elbow' cx='${x4}' cy='${y3}' r='2.8' fill='${seg.color}'/>
      <text class='slice-label' x='${xt}' y='${y3 - 8}' text-anchor='${anchor}'>
        <tspan class='label-cat' x='${xt}' dy='0' style='font-size:${setting.lf};'>${cat}</tspan>
        <tspan class='label-val' x='${xt}' dy='20' style='font-size:${setting.vf};'>${formattedVal} · ${pctLabel}</tspan>
      </text>
    </g>`;
  }).join('');
}

/**
 * @param {any} payload
 * @returns {void}
 */
function render(payload) {
  const rows = ITS.rowsOf(payload);

  if (!rows.length) {
    ITS.empty('No tickets created MTD');
    return;
  }

  const role0 = String(payload?.config?.role || payload?.meta?.role || 'open-priority').toLowerCase();
  const role = role0.includes('status') ? 'status' : role0.includes('closed') ? 'closed-priority' : 'priority';

  const labelNames = role === 'status'
    ? ['Status.Name','Status','status_name','category_label','name','category','label']
    : ['Priority.Name','Priority','priority_name','category_label','name','category','label'];

  const valNames = ['__Value','Value','request_count','Count','Requests','OpenTickets','ClosedTickets','Total','rowcount','count'];

  const items = sortItems(
    rows
      .map(function(r) {
        return {
          label: ITS.txt(r, labelNames, 'Unknown'),
          value: ITS.val(r, valNames, 0)
        };
      })
      .filter(function(x) {
        return x.value > 0;
      })
  );

  const total = items.reduce(function(a, b) {
    return a + b.value;
  }, 0);

  const cls = role === 'status' ? 'status' : role === 'closed-priority' ? 'closed-priority' : 'priority';
  const center = role === 'closed-priority' ? ['CLOSED','MTD'] : ['CREATED','MTD'];
  const emptyText = role === 'closed-priority' ? 'No closed tickets MTD' : 'No tickets created MTD';

  const top = role === 'status'
    ? 'linear-gradient(90deg,#1D2BFF,#14C8B6,#0F172A,#94A3B8,rgba(255,255,255,.95))'
    : 'linear-gradient(90deg,#1D2BFF,#14C8B6,#48B56B,rgba(255,255,255,.95))';

  ITS.root().innerHTML =
    `<div class='${cls}-shell'>
      <div class='${cls}-card' style='--top-gradient:${top}'>
        <svg class='${cls}-donut' viewBox='0 0 500 300' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg'>
          <circle cx='250' cy='150' r='94' fill='none' stroke='rgba(255,255,255,.66)' stroke-width='39'/>
          ${groups(items, role === 'status' ? 'status' : 'priority', total)}
          <circle cx='250' cy='150' r='64' fill='rgba(255,255,255,.94)' stroke='rgba(226,232,240,.98)' stroke-width='2'/>
          <text class='center-value' x='250' y='137' text-anchor='middle'>${ITS.nf0.format(total)}</text>
          <text class='center-label' x='250' y='171' text-anchor='middle'>
            <tspan x='250' dy='0'>${center[0]}</tspan>
            <tspan x='250' dy='15'>${center[1]}</tspan>
          </text>
          ${total === 0 ? `<text class='empty-note' x='250' y='150' text-anchor='middle'>${emptyText}</text>` : ''}
        </svg>
      </div>
    </div>`;

  const centerValue = /** @type {Element | null} */ (ITS.root().querySelector('.center-value'));
  const tileKey = `donut-center:${role0}`;

  rollCenterValue(tileKey, centerValue, total);
}

receiveDashboard(render);
    </script>

<script src="../js/pull-to-refresh.js?v=20260808"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../service-worker.js').catch(function() {});
    });
  }
</script>
</body>
