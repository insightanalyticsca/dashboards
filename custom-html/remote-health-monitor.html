<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        :root {
            --c0: #0808EE;
            --c1: #09C698;
            --c2: #171777;
            --c3: #c9c9c9;
            --c4: #d4d4d9;
            --c5: #BBFF05;
            --c6: #4F63F7;
            --c7: #12DDB8;
            --c8: #635BCB;
            --c9: #DDF76D;
            --ink: #171777;
            --muted: #66719a;
            --line: #d8dbe8;
            --bg: #f3f4f8;
            --tile: #ffffff;
            --good: #09C698;
            --bad: #ef5350;
            --black: #111111;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: Segoe UI,Inter,Arial,sans-serif;
            color: var(--ink)
        }

        * {
            box-sizing: border-box
        }

        .tile {
            width: 100%;
            height: 100%;
            background: var(--tile);
            border: 1px solid var(--line);
            box-shadow: 0 0 0 1px rgba(255,255,255,.65) inset;
            overflow: hidden;
            position: relative
        }

        .topbar {
            padding: 8px 12px 0 12px
        }

        .title {
            font-size: 13px;
            line-height: 1.15;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: .1px
        }

        .menu {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #c6c8d4;
            font-size: 16px;
            line-height: 1
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 8px 12px 0 12px
        }

        .legend-item {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: #586180
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%
        }

        .body {
            padding: 6px 10px 10px 10px;
            height: calc(100% - 34px)
        }

        .chart {
            width: 100%;
            height: 100%
        }

        .empty {
            height: 100%;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-size: 12px;
            font-weight: 700
        }

        .table-wrap {
            padding: 8px 10px 10px 10px;
            height: calc(100% - 32px)
        }

        .pbix-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 11px
        }

            .pbix-table th, .pbix-table td {
                border: 1px solid #c8cbda;
                padding: 9px 10px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            .pbix-table thead th {
                background: #1c1d8a;
                color: #fff;
                font-weight: 800
            }

            .pbix-table tbody th {
                background: #1c1d8a;
                color: #fff;
                text-align: left;
                font-weight: 800
            }

            .pbix-table tbody td {
                background: #d7d8df;
                color: var(--ink);
                text-align: right
            }

            .pbix-table tbody tr.delta td {
                font-weight: 800
            }

                .pbix-table tbody tr.delta td.good {
                    color: var(--good)
                }

                .pbix-table tbody tr.delta td.bad {
                    color: var(--bad)
                }

            .pbix-table .left {
                text-align: left
            }

        .kpi {
            display: grid;
            grid-template-columns: minmax(0,1fr) 110px;
            gap: 8px;
            align-items: center;
            height: 100%;
            padding: 10px 12px 12px 12px
        }

        .kpi-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.2
        }

        .kpi-value {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--ink);
            line-height: .95;
            margin-top: 8px
        }

        .kpi-caption {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            margin-top: 8px
        }

        .kpi-delta {
            font-size: 12px;
            font-weight: 800;
            margin-top: 8px
        }

            .kpi-delta.good {
                color: var(--good)
            }

            .kpi-delta.bad {
                color: var(--bad)
            }

        .info-rotator {
            margin-top: 10px;
            min-height: 30px;
            font-size: 11px;
            color: var(--muted);
            font-weight: 700
        }

        .kpi-right {
            display: grid;
            grid-template-rows: 110px 44px;
            gap: 8px;
            align-items: center
        }

        .card-chart, .spark {
            width: 100%;
            height: 100%
        }

        .section-grid {
            display: grid;
            grid-template-columns: 1.2fr .9fr;
            gap: 10px;
            height: calc(100% - 32px);
            padding: 8px 10px 10px 10px
        }

        .mini-card {
            border: 1px solid var(--line);
            background: #fbfcff;
            padding: 8px 10px;
            border-radius: 8px
        }

        .mini-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .mini-value {
            font-size: 22px;
            font-weight: 900;
            color: var(--ink);
            margin-top: 4px
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .list-row {
            display: grid;
            grid-template-columns: 10px 1fr auto;
            gap: 8px;
            align-items: center;
            font-size: 11px
        }

        .small {
            font-size: 11px;
            color: var(--muted);
            font-weight: 700
        }

        .big-center {
            display: grid;
            place-items: center;
            height: 100%;
            text-align: center
        }

        .health-grid {
            display: grid;
            grid-template-columns: 132px 1fr;
            gap: 10px;
            height: calc(100% - 32px);
            padding: 8px 10px 10px 10px
        }

        .health-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .health-chip {
            border: 1px solid var(--line);
            background: #fbfcff;
            border-radius: 8px;
            padding: 6px 8px
        }

            .health-chip .cap {
                font-size: 10px;
                font-weight: 800;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: .3px
            }

            .health-chip .val {
                font-size: 14px;
                font-weight: 900;
                color: var(--ink);
                margin-top: 3px
            }

        .health-table {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 100%;
            overflow: auto;
            padding-right: 2px
        }

        .health-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #eef1f7;
            padding-bottom: 6px
        }

        .pill {
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800
        }

            .pill.good {
                background: rgba(9,198,152,.12);
                color: var(--good)
            }

            .pill.bad {
                background: rgba(239,83,80,.12);
                color: var(--bad)
            }

            .pill.warn {
                background: rgba(251,192,45,.15);
                color: #9b7a00
            }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
const CORPORATE=["#0808EE","#09C698","#171777","#c9c9c9","#d4d4d9","#BBFF05","#4F63F7","#12DDB8","#635BCB","#DDF76D"];
function n(v){ if (typeof v==='number') return Number.isFinite(v)?v:0; const s=String(v??'').replace(/[$,%\s,]/g,''); const x=Number(s); return Number.isFinite(x)?x:0; }
function rowsOf(v){
  if (Array.isArray(v)) return v;
  if (!v) return [];
  if (Array.isArray(v.rows)) return v.rows;
  if (Array.isArray(v.data)) return v.data;
  if (Array.isArray(v.items)) return v.items;
  if (Array.isArray(v.result)) return v.result;
  if (Array.isArray(v.result?.rows)) return v.result.rows;
  if (Array.isArray(v.result?.data)) return v.result.data;
  if (Array.isArray(v.payload?.rows)) return v.payload.rows;
  if (Array.isArray(v.payload?.data)) return v.payload.data;
  if (Array.isArray(v.model?.rows)) return v.model.rows;
  if (Array.isArray(v.model?.data)) return v.model.data;
  return [];
}
function extract(source){
  const base = source || window.DashVisualContext || {};
  const payload = base.payload || {};
  const model = payload.model || base.model || {};
  const config = payload.config || base.config || {};
  const meta = payload.meta || base.meta || {};
  const rows = rowsOf(model).length ? rowsOf(model) : rowsOf(payload).length ? rowsOf(payload) : rowsOf(base);
  return { base, payload, model, config, meta, rows };
}
function keyOf(obj, keys){
  if (!obj) return '';
  const map = {};
  Object.keys(obj).forEach(k => map[k.toLowerCase()] = k);
  for (const name of keys){ const hit = map[String(name).toLowerCase()]; if (hit) return hit; }
  return '';
}
function pick(obj, keys, fallback=''){ const k = keyOf(obj, keys); return k ? obj[k] : fallback; }
function monthStart(v){ const d=new Date(v); return Number.isFinite(d.getTime()) ? new Date(d.getFullYear(), d.getMonth(), 1) : null; }
function monthLabel(v){ const d=v instanceof Date ? v : monthStart(v); return d ? d.toLocaleDateString(undefined,{month:'short'}) : String(v??''); }
function shortFmt(value, digits=0){
  const abs = Math.abs(n(value));
  if (abs >= 1000000) return (n(value)/1000000).toFixed(abs >= 10000000 ? 0 : 1).replace(/\.0$/,'') + 'M';
  if (abs >= 1000) return (n(value)/1000).toFixed(abs >= 100000 ? 0 : 1).replace(/\.0$/,'') + 'K';
  return n(value).toLocaleString(undefined,{maximumFractionDigits:digits,minimumFractionDigits:digits});
}
function moneyFmt(value, digits=0){ return n(value).toLocaleString(undefined,{maximumFractionDigits:digits,minimumFractionDigits:digits}); }
function pctFmt(value, digits=2){ return (n(value)).toFixed(digits).replace(/\.00$/,'') + '%'; }
function canonicalBucket(v){
  const s = String(v??'').toLowerCase();
  if (!s) return '';
  if (s.includes('current') || s.includes('0-30') || s.includes('1-30') || s === '30') return '0-30';
  if (s.includes('31-60')) return '31-60';
  if (s.includes('61-90')) return '61-90';
  if (s.includes('>90') || s.includes('91-') || s.includes('120') || s.includes('90+')) return '>90';
  return String(v);
}
function sortPeriodStrings(values){
  return [...values].sort((a,b)=>{
    const da = new Date(a); const db = new Date(b);
    const va = Number.isFinite(da.getTime()) ? da.getTime() : String(a);
    const vb = Number.isFinite(db.getTime()) ? db.getTime() : String(b);
    return va < vb ? -1 : va > vb ? 1 : 0;
  });
}
function infoTexts(rows){
  const texts=[];
  rows.forEach(row=>{
    ['InfoText','Info','Description','Detail','Summary','AltText1','AltText2','AltText3','SecondaryText','TertiaryText'].forEach(name=>{
      const key=keyOf(row,[name]);
      const value=key ? String(row[key]??'').trim() : '';
      if (value && !texts.includes(value)) texts.push(value);
    });
  });
  return texts;
}
function onDashMessages(render, resize){
  function handle(source){ try{ render(source); } catch(err){ console.warn('custom html render failed', err); } }
  window.addEventListener('message', ev => {
    const type = String(ev?.data?.type || '');
    if (!type.startsWith('dashboard-custom-html:')) return;
    if (type.endsWith(':resize')) { if (resize) resize(); return; }
    if (type.endsWith(':init') || type.endsWith(':update')) handle(ev.data);
  });
  window.addEventListener('resize', ()=>{ if (resize) resize(); });
  handle(window.DashVisualContext || {});
}

let gaugeChart, trendChart;
function statusClass(score){
  const value = n(score);
  if (value >= 85) return 'good';
  if (value >= 65) return 'warn';
  return 'bad';
}
async function postJson(url, body){
  return fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},
    credentials:'same-origin',
    cache:'no-cache',
    body:JSON.stringify(body)
  });
}
async function fetchLive(config){
  const response = await postJson(String(config.endpoint || '/Dashboard/GetCustomHtmlLiveData'), {
    schema: String(config.schema || 'its'),
    obj: String(config.object || config.obj || 'vw_RemoteDbHealth'),
    payloadMode: String(config.payloadMode || 'remoteHealthMonitor'),
    trendSchema: String(config.trendSchema || 'its'),
    trendObject: String(config.trendObject || 'vw_RemoteDbHealth_history'),
    trendTimeField: String(config.trendTimeField || 'snapshot_time'),
    trendValueField: String(config.trendValueField || 'health_score'),
    trendMaxPoints: Number(config.trendMaxPoints || 12)
  });
  if (!response.ok) throw new Error('live fetch failed');
  return response.json();
}
function healthRows(input){
  const ctx = extract(input);
  const rows = ctx.rows;
  const model = ctx.model || {};
  return {ctx, rows, model};
}
async function render(source){
  const {ctx, rows, model} = healthRows(source);
  document.getElementById('root').innerHTML = `
    <div class="tile">
      <div class="topbar"><div class="title">Remote Health Monitor</div></div>
      <div class="health-grid">
        <div style="display:grid;grid-template-rows:120px 1fr;gap:8px">
          <div id="gauge" class="mini-card" style="padding:0"></div>
          <div id="trend" class="mini-card" style="padding:6px 8px"><div class="mini-title">Score Trend</div><div id="trendChart" class="chart" style="height:calc(100% - 16px)"></div></div>
        </div>
        <div style="display:grid;grid-template-rows:auto auto 1fr;gap:8px">
          <div class="health-list">
            <div class="health-chip"><div class="cap">Remote DB</div><div id="remoteDb" class="val">-</div></div>
            <div class="health-chip"><div class="cap">Snapshot</div><div id="snapshot" class="val">-</div></div>
            <div class="health-chip"><div class="cap">Top Wait</div><div id="topWait" class="val">-</div></div>
            <div class="health-chip"><div class="cap">Active Requests</div><div id="activeReq" class="val">0</div></div>
          </div>
          <div class="health-list">
            <div class="health-chip"><div class="cap">Blockers</div><div id="blockers" class="val">0</div></div>
            <div class="health-chip"><div class="cap">Blocked</div><div id="blocked" class="val">0</div></div>
            <div class="health-chip"><div class="cap">Long Running</div><div id="longRunning" class="val">0</div></div>
            <div class="health-chip"><div class="cap">Open Txn Sessions</div><div id="openTxn" class="val">0</div></div>
          </div>
          <div class="mini-card" style="min-height:0"><div class="mini-title">Instance Signals</div><div id="dbList" class="health-table" style="margin-top:8px"></div></div>
        </div>
      </div>
    </div>`;

  let live = model;
  if (!rows.length && !model.health_score){
    try {
      const payload = await fetchLive(ctx.config || {});
      live = payload.model || payload.payload?.model || payload.result?.model || payload;
    } catch (e) {
      document.getElementById('dbList').innerHTML = '<div class="empty">No SQL data.</div>';
      return;
    }
  }

  const healthScore = n(live.health_score || live.score || live.HealthScore);
  const history = Array.isArray(live.score_history) ? live.score_history.map(n) : [];
  const labels = Array.isArray(live.score_labels) ? live.score_labels : history.map((_,i)=>String(i+1));
  const dbRows = rows.length ? rows : (Array.isArray(live.points) ? live.points : []);
  document.getElementById('remoteDb').textContent = String(live.remote_database || live.remote_server || live.server_name || '-');
  document.getElementById('snapshot').textContent = String(live.snapshot_time || live.snapshot || '-').replace('T',' ').slice(0,16);
  document.getElementById('topWait').textContent = String(live.top_wait_type || '-');
  document.getElementById('activeReq').textContent = moneyFmt(live.active_requests || live.active_request_count || 0,0);
  document.getElementById('blockers').textContent = moneyFmt(live.blocker_sessions || 0,0);
  document.getElementById('blocked').textContent = moneyFmt(live.blocked_sessions || 0,0);
  document.getElementById('longRunning').textContent = moneyFmt(live.long_running_requests || 0,0);
  document.getElementById('openTxn').textContent = moneyFmt(live.sessions_with_open_txn || 0,0);

  gaugeChart = gaugeChart || echarts.init(document.getElementById('gauge'));
  gaugeChart.setOption({
    series: [{
      type: 'pie',
      radius: ['64%','86%'],
      center: ['50%','50%'],
      silent: true,
      label: {show:false},
      data: [
        {value: Math.max(0, Math.min(100, healthScore)), itemStyle:{color: statusClass(healthScore)==='good' ? CORPORATE[1] : statusClass(healthScore)==='warn' ? CORPORATE[5] : '#ef5350'}},
        {value: Math.max(0, 100 - Math.max(0, Math.min(100, healthScore))), itemStyle:{color:'#eef1f7'}}
      ]
    }],
    graphic: [
      {type:'text', left:'center', top:'30%', style:{text:String(Math.round(healthScore)), fill:'#171777', font:'900 24px Segoe UI'}},
      {type:'text', left:'center', top:'55%', style:{text:'Health Score', fill:'#7a82a6', font:'700 11px Segoe UI'}}
    ]
  }, true);

  trendChart = trendChart || echarts.init(document.getElementById('trendChart'));
  trendChart.setOption({
    animationDuration: 320,
    grid:{left:24,right:8,top:8,bottom:18},
    xAxis:{type:'category', data: labels, axisTick:{show:false}, axisLabel:{color:'#6f76a1', fontSize:10}, axisLine:{lineStyle:{color:'#d7dbe8'}}},
    yAxis:{type:'value', min:0, max:100, axisLabel:{color:'#6f76a1'}, splitLine:{lineStyle:{color:'#eef1f7'}}},
    series:[{
      type:'line',
      smooth:true,
      symbol:'circle',
      symbolSize:6,
      lineStyle:{width:2,color:CORPORATE[0]},
      areaStyle:{color:'rgba(8,8,238,.10)'},
      itemStyle:{color:CORPORATE[0]},
      data: history
    }]
  }, true);

  document.getElementById('dbList').innerHTML = (dbRows || []).slice(0,8).map(row => {
    const name = pick(row,['database_name','remote_database','db_name','name','database'],'Database');
    const score = n(pick(row,['health_score','score','HealthScore'], healthScore));
    const state = String(pick(row,['health_status','status','State'], statusClass(score))).trim() || statusClass(score);
    const waits = moneyFmt(pick(row,['blocked_sessions','wait_count','blocked'],0),0);
    return `<div class="health-row">
      <div style="font-size:11px;font-weight:800;color:#171777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
      <span class="pill ${statusClass(score)}">${state}</span>
      <div class="small">${waits}</div>
    </div>`;
  }).join('') || '<div class="empty">No SQL data.</div>';
}
onDashMessages(render, ()=>{ if (gaugeChart) gaugeChart.resize(); if (trendChart) trendChart.resize(); });

    </script>
</body>
</html>
