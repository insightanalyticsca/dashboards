<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty{height:100%;display:grid;place-items:center;color:#5b6171;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.36);border:1px dashed rgba(16,20,111,.18);border-radius:14px}.card{width:100%;height:100%;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(241,245,249,.96));border:1px solid rgba(16,20,111,.10);box-shadow:0 10px 30px rgba(16,20,111,.10);border-radius:16px;padding:10px;display:flex;flex-direction:column;min-height:0}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px;flex:0 0 auto}.title{font-size:14px;font-weight:950;letter-spacing:-.025em;color:#10146F}.sub{font-size:8px;color:#64748B;font-weight:850}.pill{font-size:8px;font-weight:950;border:1px solid rgba(16,20,111,.12);border-radius:999px;padding:4px 7px;background:rgba(16,20,111,.05);white-space:nowrap}.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:0 0 7px 0;flex:0 0 auto}.chip{border:1px solid rgba(16,20,111,.14);background:rgba(255,255,255,.72);color:#334155;border-radius:999px;font-size:8px;font-weight:950;padding:4px 8px;cursor:pointer;line-height:1}.chip:hover{background:rgba(16,20,111,.07)}.chip.on{background:#10146F;color:#fff;border-color:#10146F}.body{min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;display:flex;flex-direction:column;gap:7px}.sectionLabel{font-size:9px;font-weight:950;color:#64748B;text-transform:uppercase;letter-spacing:.08em;margin:4px 2px 0}.job{display:grid;grid-template-columns:minmax(132px,1.2fr) minmax(180px,2.1fr) 92px;gap:9px;align-items:center;background:rgba(255,255,255,.76);border:1px solid rgba(16,20,111,.11);border-radius:13px;padding:8px;min-height:52px}.job.badJob{border-color:rgba(214,69,80,.36);background:linear-gradient(135deg,rgba(255,245,246,.94),rgba(255,255,255,.76))}.job.warnJob{border-color:rgba(230,167,0,.30);background:linear-gradient(135deg,rgba(255,251,235,.96),rgba(255,255,255,.76))}.jn{min-width:0}.jobname{font-size:10px;font-weight:950;line-height:1.15;color:#10146F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runs{display:flex;gap:4px;align-items:center;min-width:0;overflow:hidden}.run{width:18px;height:28px;border-radius:6px;border:1px solid rgba(16,20,111,.16);cursor:pointer;position:relative;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}.run:hover{transform:translateY(-3px);filter:brightness(1.05);box-shadow:0 7px 16px rgba(15,23,42,.22)}.run::after{content:attr(data-tip);position:fixed;left:var(--tip-x,0);top:var(--tip-y,0);transform:translate(12px,12px);background:rgba(7,10,41,.94);color:#fff;z-index:9999;border-radius:8px;padding:7px 8px;white-space:pre;line-height:1.28;font-size:10px;font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.24);opacity:0;pointer-events:none;max-width:380px}.run:hover::after{opacity:1}.ok{background:linear-gradient(180deg,#25D7A6,#09A77D)}.bad{background:linear-gradient(180deg,#FF6B78,#D64550)}.warn{background:linear-gradient(180deg,#FFD46A,#E6A700)}.runx{background:linear-gradient(180deg,#9BA3AF,#64748B)}.metrics{text-align:right;font-size:9px;font-weight:950;color:#334155;line-height:1.22}.metrics .fail{color:#D64550}.metrics .warnTxt{color:#B77900}.metrics .okTxt{color:#008060}.barWrap{height:4px;width:100%;background:rgba(16,20,111,.08);border-radius:999px;overflow:hidden;margin-top:4px}.bar{height:100%;background:linear-gradient(90deg,#25D7A6,#09A77D);border-radius:999px}.modal{position:fixed;inset:0;background:rgba(2,6,23,.36);display:none;align-items:center;justify-content:center;z-index:99999}.modal.on{display:flex}.dialog{width:min(760px,92vw);max-height:84vh;background:linear-gradient(135deg,#fff,#f1f5f9);border-radius:16px;border:1px solid rgba(16,20,111,.14);box-shadow:0 24px 80px rgba(2,6,23,.28);padding:14px;overflow:auto;color:#10146F}.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid rgba(16,20,111,.12);padding-bottom:10px;margin-bottom:10px}.dt{font-size:16px;font-weight:950;letter-spacing:-.02em}.close{border:0;background:#10146F;color:#fff;border-radius:999px;width:28px;height:28px;font-weight:950;cursor:pointer}.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:11px;margin-bottom:10px}.k{color:#64748B;font-weight:900}.v{font-weight:850;min-width:0;word-break:break-word}.msg{white-space:pre-wrap;background:rgba(16,20,111,.05);border:1px solid rgba(16,20,111,.08);border-radius:10px;padding:9px;font:11px/1.35 Consolas,monospace;color:#1e293b}.legend{display:flex;gap:10px;align-items:center;font-size:8px;font-weight:850;color:#64748B;margin-top:6px;flex:0 0 auto}.dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}.foot{font-size:8px;color:#64748B;font-weight:800;text-align:right;margin-top:2px;flex:0 0 auto}.body::-webkit-scrollbar{width:7px}.body::-webkit-scrollbar-thumb{background:rgba(16,20,111,.18);border-radius:99px}@media(max-width:720px){.job{grid-template-columns:1fr;gap:6px}.metrics{text-align:left}.runs{overflow-x:auto;padding-bottom:2px}.run{flex:0 0 auto}}
</style>
</head>
<body>
<div id="root"><div class="empty">Waiting for live SQL Agent job rows...</div></div>
<div id="modal" class="modal"><div class="dialog"><div class="dh"><div><div id="mt" class="dt"></div><div id="ms" class="sub"></div></div><button class="close" onclick="document.getElementById('modal').classList.remove('on')">×</button></div><div id="mk" class="kv"></div><div id="mm" class="msg"></div></div></div>
<script>
const U=(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rowsOf=p=>Array.isArray(p?.data)?p.data:Array.isArray(p?.result?.data)?p.result.data:Array.isArray(p?.payload?.data)?p.payload.data:Array.isArray(p?.rows)?p.rows:[];const mapKeys=r=>{const m={};Object.keys(r||{}).forEach(k=>m[k.toLowerCase()]=k);return m};const get=(r,n,fb='')=>{const m=mapKeys(r);for(const x of n){const k=m[String(x).toLowerCase()];if(k)return r[k]??fb}return fb};const num=(v,fb=0)=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:fb};const dt=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};const ago=v=>{if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return '';const s=Math.max(0,(Date.now()-d.getTime())/1000);if(s<3600)return `${Math.floor(s/60)}m ago`;if(s<86400)return `${Math.floor(s/3600)}h ago`;return `${Math.floor(s/86400)}d ago`};const dur=s=>{s=Math.max(0,Math.round(num(s,0)));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h?`${h}:`:'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};return{esc,rowsOf,get,num,dt,ago,dur}})();
let CURRENT=[];let ALL_JOBS=[];let FILTER='failedFirst';
function statusClass(r){const s=Number(U.get(r,['run_status'],99));if(s===0)return'bad';if(s===1)return'ok';if(s===2||s===3||s===4)return'warn';return'runx'}
function statusText(r){return U.get(r,['run_status_label','status'],'Unknown')}
function jobClass(j){if(j.healthSort===0||j.failures>0)return'badJob';if(j.healthSort===2||j.warnings>0)return'warnJob';return''}
function showDetail(i){const r=CURRENT[i];if(!r)return;const job=U.get(r,['display_name','job_name'],'SQL job');document.getElementById('mt').textContent=job;document.getElementById('ms').textContent=`${statusText(r)} · ${U.dt(U.get(r,['run_start_time']))}`;const fields=[['Host',U.get(r,['host_name'])],['Job name',U.get(r,['job_name'])],['Health bucket',U.get(r,['health_bucket'])],['Run start',U.dt(U.get(r,['run_start_time']))],['Run end',U.dt(U.get(r,['run_end_time']))],['Duration',U.get(r,['duration_text'])||U.dur(U.get(r,['duration_seconds']))],['Status',statusText(r)],['Failed steps',U.get(r,['failed_step_count'],0)],['Failures last 15',U.get(r,['failures_last_15'],0)],['Success rate last 15',`${U.num(U.get(r,['success_rate_last_15_pct']),0).toFixed(1)}%`]];document.getElementById('mk').innerHTML=fields.map(([k,v])=>`<div class="k">${U.esc(k)}</div><div class="v">${U.esc(v||'')}</div>`).join('');const fail=U.get(r,['failed_steps_text'],'');const steps=U.get(r,['step_messages_text'],'');const msg=U.get(r,['outcome_message'],'');document.getElementById('mm').textContent=(fail?`FAILED STEP(S)\n${fail}\n\n`: '')+(steps?`STEP DETAIL\n${steps}\n\n`:'')+`JOB MESSAGE\n${msg||'(no message returned)'}`;document.getElementById('modal').classList.add('on')}
function setFilter(f){FILTER=f;drawJobs()}
function chip(label,f,count){return `<button class="chip ${FILTER===f?'on':''}" onclick="setFilter('${f}')">${U.esc(label)}${count!==undefined?` ${count}`:''}</button>`}
function drawJobs(){const root=document.getElementById('root');let jobs=ALL_JOBS.slice();if(FILTER==='failedOnly')jobs=jobs.filter(j=>j.failures>0||j.healthSort===0);if(FILTER==='running')jobs=jobs.filter(j=>j.latestStatus===4||j.healthSort===2);if(FILTER==='healthy')jobs=jobs.filter(j=>j.failures===0&&j.healthSort===3);jobs.sort((a,b)=>a.healthSort-b.healthSort||a.sortOrder-b.sortOrder||String(a.name).localeCompare(String(b.name)));const totalRuns=CURRENT.length;const failedRuns=CURRENT.filter(r=>Number(U.get(r,['run_status']))===0).length;const failedJobs=ALL_JOBS.filter(j=>j.failures>0||j.healthSort===0).length;const runningJobs=ALL_JOBS.filter(j=>j.latestStatus===4||j.healthSort===2).length;const healthyJobs=ALL_JOBS.filter(j=>j.failures===0&&j.healthSort===3).length;const chips=`<div class="chips">${chip('Failed first','failedFirst')}${chip('Failed only','failedOnly',failedJobs)}${chip('Running/warn','running',runningJobs)}${chip('Healthy','healthy',healthyJobs)}${chip('All','all',ALL_JOBS.length)}</div>`;let lastBucket='';const body=jobs.map(g=>{g.rows.sort((a,b)=>U.num(U.get(a,['run_rank']),99)-U.num(U.get(b,['run_rank']),99));const last=g.rows[0]||{};const bucket=U.get(last,['health_bucket']) || (g.failures?'Recent failure':'Healthy');const label=bucket!==lastBucket?`<div class="sectionLabel">${U.esc(bucket)}</div>`:'';lastBucket=bucket;const rate=U.num(U.get(last,['success_rate_last_15_pct']),g.runs?100*g.success/g.runs:0);const agoText=U.ago(U.get(last,['run_start_time']));const lastAgo=agoText?' · '+agoText:'';return `${label}<div class="job ${jobClass(g)}"><div class="jn"><div class="jobname" title="${U.esc(g.name)}">${U.esc(g.name)}</div><div class="sub">latest: ${U.esc(statusText(last))}${U.esc(lastAgo)}</div></div><div class="runs">${g.rows.map(r=>{const tip=`${U.get(r,['display_name','job_name'])}\n${statusText(r)} · ${U.dt(U.get(r,['run_start_time']))}\nDuration ${U.get(r,['duration_text'])||U.dur(U.get(r,['duration_seconds']))}\nFailures last 15: ${U.get(r,['failures_last_15'],0)}\nClick for steps/message`;return `<button class="run ${statusClass(r)}" data-tip="${U.esc(tip)}" onmousemove="this.style.setProperty('--tip-x',event.clientX+'px');this.style.setProperty('--tip-y',event.clientY+'px')" onclick="showDetail(${r._i})" aria-label="${U.esc(tip)}"></button>`}).join('')}</div><div class="metrics"><span class="${g.failures?'fail':'okTxt'}">${g.failures} fail</span> / ${g.runs} runs<div class="sub">${rate.toFixed(0)}% success</div><div class="barWrap"><div class="bar" style="width:${Math.max(0,Math.min(100,rate))}%"></div></div></div></div>`}).join('')||'<div class="empty">No jobs match this filter.</div>';root.innerHTML=`<div class="card"><div class="head"><div><div class="title">APP100 SQL Job Run Stacks</div><div class="sub">Failed jobs are ranked first. Run order within each job stays newest-to-oldest.</div></div><div class="pill">${ALL_JOBS.length} jobs · ${failedRuns}/${totalRuns} failed runs</div></div>${chips}<div class="body">${body}</div><div class="legend"><span><i class="dot ok"></i>Success</span><span><i class="dot bad"></i>Failed</span><span><i class="dot warn"></i>Retry / canceled / running</span></div><div class="foot">Latest 15 runs per job. Click any run for detail.</div></div>`}
function render(payload){const rows=U.rowsOf(payload).slice();if(!rows.length){document.getElementById('root').innerHTML='<div class="empty">No SQL Agent job history rows returned.</div>';return}rows.sort((a,b)=>U.num(U.get(a,['health_sort']),999)-U.num(U.get(b,['health_sort']),999)||U.num(U.get(a,['sort_order']),9999)-U.num(U.get(b,['sort_order']),9999)||String(U.get(a,['display_name','job_name'])).localeCompare(String(U.get(b,['display_name','job_name'])))||U.num(U.get(a,['run_rank']),99)-U.num(U.get(b,['run_rank']),99));CURRENT=rows;const groups=new Map();rows.forEach((r,i)=>{const k=U.get(r,['job_id'])||U.get(r,['job_name']);if(!groups.has(k))groups.set(k,{name:U.get(r,['display_name','job_name'],'SQL job'),rows:[]});groups.get(k).rows.push({...r,_i:i})});ALL_JOBS=[...groups.values()].map(g=>{g.rows.sort((a,b)=>U.num(U.get(a,['run_rank']),99)-U.num(U.get(b,['run_rank']),99));const first=g.rows[0]||{};g.healthSort=U.num(U.get(first,['health_sort']),999);g.sortOrder=U.num(U.get(first,['sort_order']),9999);g.failures=U.num(U.get(first,['failures_last_15']),g.rows.filter(r=>Number(U.get(r,['run_status']))===0).length);g.warnings=U.num(U.get(first,['warnings_last_15']),g.rows.filter(r=>[2,3,4].includes(Number(U.get(r,['run_status'])))).length);g.success=U.num(U.get(first,['success_last_15']),g.rows.filter(r=>Number(U.get(r,['run_status']))===1).length);g.runs=U.num(U.get(first,['runs_last_15']),g.rows.length);g.latestStatus=U.num(U.get(first,['latest_run_status']),U.num(U.get(first,['run_status']),99));return g});drawJobs()}
window.addEventListener('message',e=>{if(!e.data||!String(e.data.type||'').startsWith('dashboard-custom-html:')||String(e.data.type||'').endsWith(':resize'))return;render(e.data.payload||e.data||{})});
</script>
<!-- Pull-to-refresh + service worker -->
<script src="../js/pull-to-refresh.js?v=20260808"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../service-worker.js').catch(function() {});
    });
  }
</script>
</body>
</html>
