  <div id="csr-root" class="csr-hide-textbox-banners"></div>
  <div id="csr-bootstrap-error"></div>
  <script>
    (function () {
      'use strict';
      const root = document.getElementById('csr-root');
      const errorHost = document.getElementById('csr-bootstrap-error');
      const query = new URLSearchParams(location.search);
      const templateId = String(query.get('templateId') || '').trim();

      function fail(error) {
        console.error('CSR page bootstrap failed.', error);
        errorHost.style.display = 'grid';
        errorHost.textContent = error && error.message ? error.message : String(error || 'CSR page could not start.');
      }

      async function start() {
        if (!templateId) throw new Error('CSR page templateId is missing.');
        if (!window.CsrDashboardRuntime || typeof window.CsrDashboardRuntime.start !== 'function') {
          throw new Error('CSR shared runtime did not load.');
        }

        const endpoint = new URL('../Dashboard/GetCsrDefinition', location.href);
        endpoint.searchParams.set('templateId', templateId);
        const response = await fetch(endpoint, { credentials: 'same-origin', cache: 'no-store' });
        if (!response.ok) throw new Error((await response.text()) || ('CSR definition request failed: HTTP ' + response.status));
        const definition = await response.json();
        document.title = definition.title || 'CSR Dashboard';
        window.CSR_PAGE_CONFIG = definition;
        window.__csrDashboardInstance = window.CsrDashboardRuntime.start(root, definition);
      }

      start().catch(fail);
    })();
  </script>
