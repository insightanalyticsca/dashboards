<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty-state{width:100%;height:100%;display:grid;place-items:center;color:#5b6171;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.38);border:1px dashed rgba(16,20,111,.18);border-radius:14px;padding:8px}.tiny-error{color:#9f1239;font-size:10px;font-weight:800;white-space:pre-wrap}

.ocsf-report,.ocsf-report *{box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}.ocsf-report{width:100%;height:100%;max-height:100%;min-height:0;padding:8px 8px 28px 8px;font-family:Segoe UI,Arial,sans-serif;color:#101828;background:radial-gradient(circle at 18% 8%, rgba(0,170,180,.16), transparent 25%),radial-gradient(circle at 88% 14%, rgba(178,255,5,.17), transparent 30%),radial-gradient(circle at 55% 90%, rgba(8,8,238,.055), transparent 34%),linear-gradient(135deg,#f8fbff 0%,#eef8f7 50%,#f8fbef 100%);overflow:hidden!important;position:relative;border-radius:18px!important;border:1px solid rgba(23,23,119,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 10px 26px rgba(15,23,42,.12);background-clip:padding-box}.ocsf-header{position:absolute;top:8px;left:10px;right:10px;height:53px;border-bottom:1px solid rgba(0,60,120,.10);display:block}.ocsf-title{margin:0;font-size:13px;line-height:.85;font-weight:800;letter-spacing:-.045em;color:#122052;max-width:none;padding-right:4px}.ocsf-subtitle{margin-top:5px;font-size:7.6px;line-height:1.12;font-weight:850;color:#344054;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ocsf-period{margin-top:3px;font-size:7.4px;line-height:1;font-weight:950;color:#667085;letter-spacing:.025em}.ocsf-card-grid{position:absolute;top:64px;bottom:34px;left:50%;transform:translateX(-50%);width:min(316px,calc(100% - 14px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-content:center;overflow:visible;z-index:2}.ocsf-kpi{position:relative;width:100%;height:70px;min-height:70px;padding:7px 8px;border-radius:18px!important;background:transparent!important;border:0!important;box-shadow:none!important;display:grid;grid-template-columns:19px minmax(0,1fr);column-gap:8px;align-items:start;overflow:hidden!important;isolation:isolate}.ocsf-kpi::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:18px;background:radial-gradient(circle at 18% 10%,rgba(8,8,238,.10),transparent 34%),radial-gradient(circle at 92% 0%,rgba(9,198,152,.14),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.98),rgba(243,248,255,.96));border:1px solid rgba(8,8,238,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.96),0 8px 18px rgba(15,23,42,.11)}.ocsf-kpi-wide{grid-column:1 / span 2;height:72px;min-height:72px;border-radius:18px!important}.ocsf-kpi-wide::before{border-radius:18px;background:radial-gradient(circle at 18% 10%,rgba(187,255,5,.24),transparent 34%),radial-gradient(circle at 90% 0%,rgba(8,8,238,.13),transparent 36%),linear-gradient(135deg,rgba(255,255,255,.99),rgba(238,248,255,.95));border:1px solid rgba(8,8,238,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.96),0 8px 18px rgba(15,23,42,.12)}.ocsf-kpi>*{position:relative;z-index:1}.ocsf-icon{width:19px;height:19px;border-radius:999px;display:grid;place-items:center;font-size:9.5px;font-weight:950;margin-top:1px;line-height:1}.ocsf-icon-total{background:rgba(8,8,238,.13);color:#0808ee}.ocsf-icon-rem{background:rgba(9,198,152,.20);color:#047857}.ocsf-icon-fail{background:rgba(255,80,100,.18);color:#be123c}.ocsf-icon-soft{background:rgba(255,179,0,.22);color:#b45309}.ocsf-icon-comp{background:rgba(187,255,5,.46);color:#166534}.ocsf-kpi-body{min-width:0;overflow:hidden}.ocsf-kpi-value{font-size:23px;line-height:.94;font-weight:950;color:#111866;white-space:nowrap;letter-spacing:-.04em}.ocsf-kpi-label{margin-top:3px;font-size:9.4px;line-height:1.05;font-weight:950;color:#101828;white-space:normal}.ocsf-kpi-caption{margin-top:2px;font-size:8.2px;line-height:1.05;font-weight:850;color:#344054;white-space:normal}.ocsf-progress-label{margin-top:3px;font-size:8px;line-height:1;font-weight:950;color:#172033;white-space:nowrap}.ocsf-progress{margin-top:4px;width:108px;max-width:100%;height:5px;border-radius:999px;background:rgba(23,23,119,.12);overflow:hidden}.ocsf-kpi-wide .ocsf-progress{width:246px;max-width:calc(100% - 2px);height:5px}.ocsf-progress-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0808ee,#09c698)}.ocsf-progress-fill-soft{background:linear-gradient(90deg,#09c698,#bbff05)}.ocsf-progress-fill-comp{background:linear-gradient(90deg,#0808ee,#bbff05)}.ocsf-footnote{position:absolute;left:12px;right:12px;bottom:0;height:14px;display:flex;align-items:center;justify-content:center;font-size:7.2px;line-height:1;font-weight:850;color:#344054;letter-spacing:.01em;background:transparent;border:0;border-radius:0;box-shadow:none;z-index:4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</style></head><body><div id="root"><div class="empty-state">Waiting for live data...</div></div><script>

const ITS = (() => {
  const nf0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const rowsOf = p => Array.isArray(p?.data) ? p.data : Array.isArray(p?.result?.data) ? p.result.data : Array.isArray(p?.payload?.data) ? p.payload.data : [];
  const key = (row, names) => { if (!row) return ''; const m={}; Object.keys(row).forEach(k => m[k.toLowerCase()] = k); for (const n of names) { const hit = m[String(n).toLowerCase()]; if (hit) return hit; } return ''; };
  const txt = (row, names, fb='') => { const k = key(row,names); const v = k ? row[k] : fb; return (v === null || v === undefined || v === '') ? fb : String(v); };
  const num = (v, fb=0) => { if (v === null || v === undefined || v === '') return fb; if (typeof v === 'number') return Number.isFinite(v) ? v : fb; const n = Number(String(v).replace(/,/g,'').replace(/%/g,'')); return Number.isFinite(n) ? n : fb; };
  const val = (row, names, fb=0) => { const k = key(row,names); return k ? num(row[k], fb) : fb; };
  const pctPlain = (v, d=1) => { let n = num(v,0); if (Math.abs(n) <= 1.5) n *= 100; return n.toFixed(d) + '%'; };
  const pctText = (v, d=0, signed=true) => { let n = num(v,0); if (Math.abs(n) <= 1.5) n *= 100; const s = signed && n > 0 ? '+' : ''; return s + n.toFixed(d) + '%'; };
  const month = v => { if (!v) return ''; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString(undefined,{month:'short',year:'numeric'}); };
  const monShort = v => { if (!v) return ''; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString(undefined,{month:'short'}); };
  const max = xs => xs.reduce((a,b)=>Math.max(a,b),0);
  const root = () => document.getElementById('root');
  const empty = (msg='No live data.') => { root().innerHTML = `<div class="empty-state">${esc(msg)}</div>`; };
  return {nf0,nf1,nf2,esc,rowsOf,key,txt,num,val,pctPlain,pctText,month,monShort,max,root,empty};
})();
function receiveDashboard(render){
  window.addEventListener('message', e => {
    if(!e.data || !String(e.data.type||'').startsWith('dashboard-custom-html:')) return;
    if(String(e.data.type||'').endsWith(':resize')) return;
    render(e.data.payload || e.data || {});
  });
  if(window.__ITS_PREVIEW_PAYLOAD__) render(window.__ITS_PREVIEW_PAYLOAD__);
}


function pctVal(v){let n=ITS.num(v,0); if(Math.abs(n)<=1.5)n*=100; return Math.max(0,Math.min(100,n));}
function render(payload){const rows=ITS.rowsOf(payload); if(!rows.length) return ITS.empty('No OCSF rows.'); const first=rows[0]; const total=rows.reduce((a,r)=>a+ITS.val(r,['TotalRisks','UploadRowCount','RowCount','rowcount'],0),0); const rem=rows.reduce((a,r)=>{const s=ITS.txt(r,['RemediationStatus','RemediatedStatus'],''); return a+(String(s).toLowerCase()==='remediated'?ITS.val(r,['UploadRowCount','RowCount','rowcount'],1):0)},0) || ITS.val(first,['RemediatedCount','Remediated'],0); const fail=rows.reduce((a,r)=>{const s=ITS.txt(r,['Status','OEBStatus'],''); return a+(String(s).toLowerCase()==='oeb-fail'||String(s).toLowerCase()==='oeb-fail'?ITS.val(r,['UploadRowCount','RowCount','rowcount'],1):0)},0) || ITS.val(first,['FailCount','OEBFail','Fail'],0); const soft=rows.reduce((a,r)=>{const s=ITS.txt(r,['Status','OEBStatus'],''); return a+(String(s).toLowerCase()==='oeb-softfail'?ITS.val(r,['UploadRowCount','RowCount','rowcount'],1):0)},0) || ITS.val(first,['SoftFailCount','OEBSoftFail','SoftFail'],0); const avg=pctVal(ITS.val(first,['AvgCompletionPct','AverageCompletionPct','CompletionPct'], rows.reduce((a,r)=>a+pctVal(ITS.val(r,['CompletionPct'],0)),0)/Math.max(1,rows.length))); const err=pctVal(ITS.val(first,['ErrCompliancePct','FailCompletionPct'],avg)); const stretch=pctVal(ITS.val(first,['StretchCompliancePct','SoftFailCompletionPct'],avg)); const month=ITS.txt(first,['MonthLabel','RiskTitle','SnapshotMonth','SelectedDate'],''); ITS.root().innerHTML=`<div class='ocsf-report'><div class='ocsf-header'><h3 class='ocsf-title'>Ontario Cyber Security Framework</h3><div class='ocsf-subtitle'>ITS-OCSF Gap Assessment · Cybersecurity Risk Tracking</div><div class='ocsf-period'>${ITS.esc(month||'Current snapshot')}</div></div><div class='ocsf-card-grid'><div class='ocsf-kpi'><div class='ocsf-icon ocsf-icon-total'>○</div><div class='ocsf-kpi-body'><div class='ocsf-kpi-value'>${ITS.nf0.format(total-rem || total)}</div><div class='ocsf-kpi-label'>Total Risks</div></div></div><div class='ocsf-kpi'><div class='ocsf-icon ocsf-icon-rem'>●</div><div class='ocsf-kpi-body'><div class='ocsf-kpi-value'>${ITS.nf0.format(rem)}</div><div class='ocsf-kpi-label'>Remediated Items</div></div></div><div class='ocsf-kpi'><div class='ocsf-icon ocsf-icon-fail'>△</div><div class='ocsf-kpi-body'><div class='ocsf-kpi-value'>${ITS.nf0.format(fail)}</div><div class='ocsf-kpi-label'>OEB-FAIL</div><div class='ocsf-kpi-caption'>ERR Compliance</div><div class='ocsf-progress-label'>${err.toFixed(0)}% Complete</div><div class='ocsf-progress'><span class='ocsf-progress-fill' style='width:${err.toFixed(0)}%'></span></div></div></div><div class='ocsf-kpi'><div class='ocsf-icon ocsf-icon-soft'>↗</div><div class='ocsf-kpi-body'><div class='ocsf-kpi-value'>${ITS.nf0.format(soft)}</div><div class='ocsf-kpi-label'>OEB-SoftFail</div><div class='ocsf-kpi-caption'>Stretch Compliance</div><div class='ocsf-progress-label'>${stretch.toFixed(0)}% Complete</div><div class='ocsf-progress'><span class='ocsf-progress-fill ocsf-progress-fill-soft' style='width:${stretch.toFixed(0)}%'></span></div></div></div><div class='ocsf-kpi ocsf-kpi-wide'><div class='ocsf-icon ocsf-icon-comp'>●</div><div class='ocsf-kpi-body'><div class='ocsf-kpi-value'>${avg.toFixed(0)}%</div><div class='ocsf-kpi-label'>Average Completion</div><div class='ocsf-progress-label'>${avg.toFixed(0)}% Complete</div><div class='ocsf-progress'><span class='ocsf-progress-fill ocsf-progress-fill-comp' style='width:${avg.toFixed(0)}%'></span></div></div></div></div><div class='ocsf-footnote'>* OEB: Ontario Energy Board</div></div>`;}

receiveDashboard(render);
</script>


<script>
// CLONE PATCH: fetch JSON and trigger render via postMessage (executive pattern).
// Original .NET: data arrived via Multi.cshtml iframe postMessage. Here we self-post.
(async function () {
  try {
    const res = await fetch('../data/its/its-ocsf-report.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    // Self-post so the visual's existing message listener picks it up.
    window.postMessage({
      type: 'dashboard-custom-html:update',
      payload: payload,
      data: payload.data || payload
    }, '*');
    // Also try calling global entry points (some visuals expose window.init/update/setData).
    setTimeout(function () {
      try {
        if (typeof window.init === 'function') window.init(payload);
        else if (typeof window.update === 'function') window.update(payload);
        else if (typeof window.setData === 'function') window.setData(payload);
      } catch (_) {}
    }, 50);
  } catch (err) {
    console.error('Clone bootstrap failed:', err);
    var root = document.getElementById('root') || document.getElementById('csr-root') || document.getElementById('app');
    if (root) root.innerHTML = '<div style="padding:12px;color:#b91c1c;font:600 12px Inter,sans-serif">⚠ ' + (err.message || err) + '</div>';
  }
})();
</script>
