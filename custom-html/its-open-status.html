<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty-state{width:100%;height:100%;display:grid;place-items:center;color:#5b6171;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.38);border:1px dashed rgba(16,20,111,.18);border-radius:14px;padding:8px}.tiny-error{color:#9f1239;font-size:10px;font-weight:800;white-space:pre-wrap}

.priority-shell,.closed-priority-shell,.status-shell,
.priority-shell *,.closed-priority-shell *,.status-shell *{box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.priority-shell,.closed-priority-shell,.status-shell{position:fixed;inset:0;width:100vw;height:100vh;min-width:0;min-height:0;padding:4px;overflow:hidden!important;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#142032}
.priority-card,.closed-priority-card,.status-card{position:absolute;inset:4px;box-sizing:border-box;overflow:hidden!important;border-radius:18px;border:1px solid #BCB8BE;background:radial-gradient(circle at 92% 8%, rgba(188,237,22,.14), transparent 26%),radial-gradient(circle at 8% 12%, rgba(21,18,244,.08), transparent 28%),linear-gradient(135deg, #FFFFFF, #EEF1F6);box-shadow:0 8px 18px rgba(33,43,60,0.10), inset 0 1px 0 rgba(255,255,255,0.86);display:flex;align-items:stretch;justify-content:stretch}
.priority-card::before,.closed-priority-card::before,.status-card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:3px;border-radius:999px;background:var(--top-gradient);box-shadow:0 0 10px rgba(29,43,255,.16);z-index:2}
.priority-donut,.closed-priority-donut,.status-donut{width:100%;height:100%;min-width:0;min-height:0;display:block;transform-origin:center center;shape-rendering:geometricPrecision;text-rendering:geometricPrecision;overflow:hidden}.seggrp{cursor:pointer}.seg{opacity:.94;transition:stroke-width .18s ease,opacity .18s ease,filter .18s ease}.seggrp:hover .seg{stroke-width:47;opacity:1;filter:drop-shadow(0 5px 9px rgba(15,23,42,.18))}.leader{fill:none;stroke-width:2.15;opacity:.92;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .18s ease,opacity .18s ease}.elbow{opacity:.9;transition:opacity .18s ease,r .18s ease}.seggrp:hover .leader{stroke-width:3;opacity:1}.seggrp:hover .elbow{opacity:1;r:3.8}.slice-label{fill:#0F172A;font-family:Segoe UI,Tahoma,Arial,sans-serif;font-weight:900;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:3.1px;stroke-linejoin:round}.label-cat{fill:#0F172A;font-weight:950}.label-val{fill:#334155;font-weight:950}.center-value{fill:#0F172A;font-family:Segoe UI,Tahoma,Arial,sans-serif;font-size:48px;font-weight:950;letter-spacing:-.045em;text-rendering:geometricPrecision}.center-label{fill:#475569;font-family:Segoe UI,Tahoma,Arial,sans-serif;font-size:12px;font-weight:950;letter-spacing:.04em;text-rendering:geometricPrecision}.empty-note{fill:#475569;font-family:Segoe UI,Tahoma,Arial,sans-serif;font-size:18px;font-weight:850}

</style></head><body><div id="root"><div class="empty-state">Waiting for live data...</div></div><script>

const ITS = (() => {
  const nf0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const rowsOf = p => Array.isArray(p?.data) ? p.data : Array.isArray(p?.result?.data) ? p.result.data : Array.isArray(p?.payload?.data) ? p.payload.data : [];
  const key = (row, names) => { if (!row) return ''; const m={}; Object.keys(row).forEach(k => m[k.toLowerCase()] = k); for (const n of names) { const hit = m[String(n).toLowerCase()]; if (hit) return hit; } return ''; };
  const txt = (row, names, fb='') => { const k = key(row,names); const v = k ? row[k] : fb; return (v === null || v === undefined || v === '') ? fb : String(v); };
  const num = (v, fb=0) => { if (v === null || v === undefined || v === '') return fb; if (typeof v === 'number') return Number.isFinite(v) ? v : fb; const n = Number(String(v).replace(/,/g,'').replace(/%/g,'')); return Number.isFinite(n) ? n : fb; };
  const val = (row, names, fb=0) => { const k = key(row,names); return k ? num(row[k], fb) : fb; };
  const pctPlain = (v, d=1) => { let n = num(v,0); if (Math.abs(n) <= 1.5) n *= 100; return n.toFixed(d) + '%'; };
  const pctText = (v, d=0, signed=true) => { let n = num(v,0); if (Math.abs(n) <= 1.5) n *= 100; const s = signed && n > 0 ? '+' : ''; return s + n.toFixed(d) + '%'; };
  const month = v => { if (!v) return ''; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString(undefined,{month:'short',year:'numeric'}); };
  const monShort = v => { if (!v) return ''; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString(undefined,{month:'short'}); };
  const max = xs => xs.reduce((a,b)=>Math.max(a,b),0);
  const root = () => document.getElementById('root');
  const empty = (msg='No live data.') => { root().innerHTML = `<div class="empty-state">${esc(msg)}</div>`; };
  return {nf0,nf1,nf2,esc,rowsOf,key,txt,num,val,pctPlain,pctText,month,monShort,max,root,empty};
})();
function receiveDashboard(render){
  window.addEventListener('message', e => {
    if(!e.data || !String(e.data.type||'').startsWith('dashboard-custom-html:')) return;
    if(String(e.data.type||'').endsWith(':resize')) return;
    render(e.data.payload || e.data || {});
  });
  if(window.__ITS_PREVIEW_PAYLOAD__) render(window.__ITS_PREVIEW_PAYLOAD__);
}


function sortItems(items){return items.slice().sort((a,b)=> b.value-a.value || String(a.label).localeCompare(String(b.label)));}
function labelSettings(n){return {lf:n<=4?'16px':n<=6?'14.5px':n<=8?'13px':'12px', vf:n<=4?'16.5px':n<=6?'15px':n<=8?'13.5px':'12.5px', gap:n<=4?46:n<=6?38:n<=8?32:27};}
function colorFor(role,label,rank){const s=String(label||'').toLowerCase(); if(role==='status'){if(s.includes('open'))return '#1D2BFF'; if(s.includes('on hold')||s.includes('hold'))return '#14C8B6'; if(s.includes('cancel'))return '#0F172A'; if(s.includes('customer')||s.includes('action'))return '#64748B'; if(s.includes('closed'))return '#94A3B8'; return ['#1D2BFF','#14C8B6','#0F172A','#64748B','#94A3B8','#F97316','#EF4444','#8B5CF6'][rank-1]||'#8B5CF6';}
 if(s.includes('high'))return '#1D2BFF'; if(s.includes('medium'))return '#14C8B6'; if(s.includes('low'))return '#48B56B'; if(s.includes('none')||s.includes('normal'))return '#94A3B8'; return ['#1D2BFF','#14C8B6','#48B56B','#94A3B8','#F97316','#EF4444','#8B5CF6'][rank-1]||'#8B5CF6';}
function groups(items,role,total){const cx=250,cy=150,r=94,stroke=39,circ=590; const {lf,vf,gap}=labelSettings(items.length); let start=0; const segs=items.map((it,i)=>{const rank=i+1; const st=start; start+=it.value; return {...it,rank,start:st,color:colorFor(role,it.label,rank)};});
 return segs.map(seg=>{const val=seg.value, pct=total?val/total:0, pctLabel=(pct*100).toFixed(1)+'%'; const dash=Math.round(pct*circ), gapDash=circ-dash, offset=-Math.round((seg.start/Math.max(total,1))*circ); const mid=(seg.start+val/2)/Math.max(total,1)*2*Math.PI-Math.PI/2; const right=Math.cos(mid)>=0; const x1=Math.round(cx+(r+8)*Math.cos(mid)), y1=Math.round(cy+(r+8)*Math.sin(mid)); const x2=Math.round(cx+(r+20)*Math.cos(mid)), y2=Math.round(cy+(r+20)*Math.sin(mid)); const rawY=Math.round(cy+((r+18)*Math.sin(mid)*.58)); const side=segs.filter(o=>{const om=(o.start+o.value/2)/Math.max(total,1)*2*Math.PI-Math.PI/2; return (Math.cos(om)>=0)===right;}); const sideRank=1+side.filter(o=>{const om=(o.start+o.value/2)/Math.max(total,1)*2*Math.PI-Math.PI/2; const oy=Math.round(cy+((r+18)*Math.sin(om)*.58)); return oy<rawY || (oy===rawY && o.rank<seg.rank);}).length; const y3=Math.round(cy-((side.length-1)*gap)/2+(sideRank-1)*gap); const x3=right?cx+r+24:cx-r-24, x4=right?400:100, xt=right?482:18, anchor=right?'end':'start'; const cat=ITS.esc(seg.label); return `<g class='seggrp'><circle class='seg' cx='${cx}' cy='${cy}' r='${r}' fill='none' stroke='${seg.color}' stroke-width='${stroke}' stroke-linecap='butt' stroke-dasharray='${dash} ${gapDash}' stroke-dashoffset='${offset}' transform='rotate(-90 ${cx} ${cy})'><title>${cat}: ${ITS.nf0.format(val)} (${pctLabel})</title></circle><polyline class='leader' points='${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y3}' stroke='${seg.color}'/><circle class='elbow' cx='${x4}' cy='${y3}' r='2.8' fill='${seg.color}'/><text class='slice-label' x='${xt}' y='${y3-8}' text-anchor='${anchor}'><tspan class='label-cat' x='${xt}' dy='0' style='font-size:${lf};'>${cat}</tspan><tspan class='label-val' x='${xt}' dy='20' style='font-size:${vf};'>${ITS.nf0.format(val)} · ${pctLabel}</tspan></text></g>`;}).join('');}
function render(payload){const rows=ITS.rowsOf(payload); if(!rows.length) return ITS.empty('No tickets created MTD'); const role0=String(payload?.config?.role||payload?.meta?.role||'open-priority').toLowerCase(); const role=role0.includes('status')?'status':role0.includes('closed')?'closed-priority':'priority'; const labelNames=role==='status'?['Status.Name','Status','status_name','name','category','label']:['Priority.Name','Priority','priority_name','name','category','label']; const valNames=['__Value','Value','Count','Requests','OpenTickets','ClosedTickets','Total','rowcount','count']; const items=sortItems(rows.map(r=>({label:ITS.txt(r,labelNames,'Unknown'),value:ITS.val(r,valNames,0)})).filter(x=>x.value>0)); const total=items.reduce((a,b)=>a+b.value,0); const cls=role==='status'?'status':(role==='closed-priority'?'closed-priority':'priority'); const center=role==='closed-priority'?['CLOSED','CREATED MTD']:['CREATED','MTD']; const empty=role==='status'||role==='priority'?'No tickets created MTD':'No closed tickets created MTD'; const top=role==='status'?'linear-gradient(90deg,#1D2BFF,#14C8B6,#0F172A,#94A3B8,rgba(255,255,255,.95))':'linear-gradient(90deg,#1D2BFF,#14C8B6,#48B56B,rgba(255,255,255,.95))'; ITS.root().innerHTML=`<div class='${cls}-shell'><div class='${cls}-card' style='--top-gradient:${top}'><svg class='${cls}-donut' viewBox='0 0 500 300' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg'><circle cx='250' cy='150' r='94' fill='none' stroke='rgba(255,255,255,.66)' stroke-width='39'/>${groups(items,role==='status'?'status':'priority',total)}<circle cx='250' cy='150' r='64' fill='rgba(255,255,255,.94)' stroke='rgba(226,232,240,.98)' stroke-width='2'/><text class='center-value' x='250' y='137' text-anchor='middle'>${ITS.nf0.format(total)}</text><text class='center-label' x='250' y='171' text-anchor='middle'><tspan x='250' dy='0'>${center[0]}</tspan><tspan x='250' dy='15'>${center[1]}</tspan></text>${total===0?`<text class='empty-note' x='250' y='150' text-anchor='middle'>${empty}</text>`:''}</svg></div></div>`;}

receiveDashboard(render);
</script>


<script>
// CLONE PATCH: fetch JSON and trigger render via postMessage (executive pattern).
// Original .NET: data arrived via Multi.cshtml iframe postMessage. Here we self-post.
(async function () {
  try {
    const res = await fetch('../data/its/its-open-status.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    // Self-post so the visual's existing message listener picks it up.
    window.postMessage({
      type: 'dashboard-custom-html:update',
      payload: payload,
      data: payload.data || payload
    }, '*');
    // Also try calling global entry points (some visuals expose window.init/update/setData).
    setTimeout(function () {
      try {
        if (typeof window.init === 'function') window.init(payload);
        else if (typeof window.update === 'function') window.update(payload);
        else if (typeof window.setData === 'function') window.setData(payload);
      } catch (_) {}
    }, 50);
  } catch (err) {
    console.error('Clone bootstrap failed:', err);
    var root = document.getElementById('root') || document.getElementById('csr-root') || document.getElementById('app');
    if (root) root.innerHTML = '<div style="padding:12px;color:#b91c1c;font:600 12px Inter,sans-serif">⚠ ' + (err.message || err) + '</div>';
  }
})();
</script>
