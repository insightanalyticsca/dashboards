<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty-state{width:100%;height:100%;display:grid;place-items:center;color:#65697B;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.45);border-radius:8px;padding:12px 5px}.tiny-error{color:#9f1239;font-size:10px;font-weight:800;white-space:pre-wrap;text-align:left}
.kb4-card{width:100%;height:100%;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 88% 8%,rgba(188,237,22,.24),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.82),rgba(226,230,236,.76));border:1px solid rgba(16,20,111,.14);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 10px 24px rgba(16,20,111,.12);padding:7px 8px;overflow:hidden;color:#10146F}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.title{font-size:12px;font-weight:900;color:#10146F;line-height:1;white-space:nowrap}.pill{font-size:9px;font-weight:900;color:#10146F;background:rgba(255,255,255,.62);border:1px solid rgba(16,20,111,.10);border-radius:999px;padding:3px 7px;white-space:nowrap}.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:6px}.tile{background:rgba(255,255,255,.56);border:1px solid rgba(16,20,111,.08);border-radius:10px;padding:4px 6px;min-width:0}.lab{font-size:8px;color:#65697B;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.val{font-size:14px;font-weight:950;color:#10146F;line-height:1.05}.deltaTop{color:var(--deltaColor,#65697B)}table{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:10px;line-height:1.05}th{background:#10146F;color:white;padding:4px 6px;text-align:left;font-weight:900}th:first-child{border-radius:7px 0 0 7px}th:last-child{border-radius:0 7px 7px 0}td{padding:5px 6px;color:#10146F;border-top:1px solid rgba(255,255,255,.44);border-bottom:1px solid rgba(16,20,111,.05)}.type{font-weight:850;color:#10146F}.num{text-align:right;font-variant-numeric:tabular-nums}.current{font-weight:950}.delta{font-weight:950}.data-row{position:relative}.data-row:hover{filter:brightness(.985)}.data-row:hover::after{content:attr(data-tip);position:absolute;right:4px;top:-26px;max-width:260px;padding:6px 8px;border-radius:9px;background:rgba(16,20,111,.94);color:#fff;font-size:9px;font-weight:800;line-height:1.25;box-shadow:0 8px 18px rgba(16,20,111,.22);z-index:30;pointer-events:none;white-space:normal}.empty{text-align:center;color:#65697B;font-size:10px;font-weight:850;background:rgba(255,255,255,.45);border-radius:8px;padding:12px 5px}.foot{margin-top:4px;font-size:8.5px;color:#65697B;font-weight:750;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
</style></head><body><div id="root"><div class="empty-state">Waiting for live data...</div></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('root');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt0 = v => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(Number.isFinite(Number(v)) ? Number(v) : 0);
  const fmtPct0 = v => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(Number.isFinite(Number(v)) ? Number(v) : 0) + '%';
  const fmt1 = v => (Number.isFinite(Number(v)) ? Number(v) : 0).toFixed(1);
  const fmt3 = v => (Number.isFinite(Number(v)) ? Number(v) : 0).toFixed(3);
  const signed0 = v => { const n = Number.isFinite(Number(v)) ? Number(v) : 0; return n > 0 ? '+' + fmt0(n) : fmt0(n); };
  const n = (v, fb = 0) => {
    if (v === null || v === undefined || v === '') return fb;
    if (typeof v === 'number') return Number.isFinite(v) ? v : fb;
    const x = Number(String(v).replace(/,/g, '').replace(/%/g, '').trim());
    return Number.isFinite(x) ? x : fb;
  };
  const key = (row, names) => {
    if (!row) return '';
    const map = {};
    for (const k of Object.keys(row)) map[k.toLowerCase()] = k;
    for (const nm of names) {
      const hit = map[String(nm).toLowerCase()];
      if (hit) return hit;
    }
    return '';
  };
  const txt = (row, names, fb = '') => {
    const k = key(row, names);
    const v = k ? row[k] : fb;
    return v === null || v === undefined ? fb : String(v);
  };
  const val = (row, names, fb = 0) => {
    const k = key(row, names);
    return k ? n(row[k], fb) : fb;
  };
  const rowsOf = p => {
    if (Array.isArray(p?.data)) return p.data.filter(Boolean);
    if (Array.isArray(p?.payload?.data)) return p.payload.data.filter(Boolean);
    if (Array.isArray(p?.result?.data)) return p.result.data.filter(Boolean);
    if (Array.isArray(p?.model?.data)) return p.model.data.filter(Boolean);
    if (Array.isArray(p?.model?.rows)) return p.model.rows.filter(Boolean);
    return [];
  };
  function parseDate(v) {
    if (v instanceof Date && !Number.isNaN(v.getTime())) return v;
    if (v === null || v === undefined || v === '') return null;
    const s = String(v).trim();
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    const d = new Date(s);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function monthKey(v) {
    const d = parseDate(v);
    if (!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function monthStartKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
  function addMonths(d, m) { return new Date(d.getFullYear(), d.getMonth() + m, 1); }
  function lastCompletedMonthStart(now = new Date()) { return new Date(now.getFullYear(), now.getMonth() - 1, 1); }
  function monthLabel(d) { return d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }
  function monthShort(d) { return d.toLocaleDateString(undefined, { month: 'short' }); }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function setEmpty(message) { root.innerHTML = `<div class="empty-state">${esc(message)}</div>`; }
  function setError(err) { root.innerHTML = `<div class="empty-state tiny-error">${esc(err && err.stack ? err.stack : err)}</div>`; }
  function receive(render) {
    window.addEventListener('message', e => {
      const type = String(e?.data?.type || '');
      if (!type.startsWith('dashboard-custom-html:')) return;
      if (type.endsWith(':resize')) return;
      try { render(e.data.payload || e.data || {}); } catch (err) { setError(err); }
    });
  }
  window.ITS_LIVE = { root, esc, fmt0, fmtPct0, fmt1, fmt3, signed0, n, key, txt, val, rowsOf, parseDate, monthKey, monthStartKey, firstOfMonth, endOfMonth, addMonths, lastCompletedMonthStart, monthLabel, monthShort, ymd, setEmpty, setError, receive };
})();
</script>

<script>
(() => {
  const U = window.ITS_LIVE;
  function render(payload) {
    const rows = U.rowsOf(payload);
    const reportStart = U.lastCompletedMonthStart();
    const reportEnd = U.endOfMonth(reportStart);
    const mKey = U.monthStartKey(reportStart);
    const label = U.monthLabel(reportStart);
    const data = rows.filter(r => U.monthKey(U.txt(r, ['month_start','MonthStart','monthStart'])) === mKey)
      .sort((a,b) => U.txt(a, ['failure_type','FailureType','type'], 'Unknown').localeCompare(U.txt(b, ['failure_type','FailureType','type'], 'Unknown')))
      .slice(0,5);
    const currentTotal = data.reduce((a,r)=>a+U.val(r,['failure_count','FailureCount'],0),0);
    const priorTotal = data.reduce((a,r)=>a+U.val(r,['prior_month_count','PriorMonthCount'],0),0);
    const delta = currentTotal - priorTotal;
    const deltaColor = delta > 0 ? '#EF1435' : (delta < 0 ? '#12C7A3' : '#65697B');
    let body = '';
    if (!data.length) {
      body = `<tr><td colspan="4" class="empty">No KnowBe4 phishing failure rows found for ${U.esc(label)}</td></tr>`;
    } else {
      body = data.map(r => {
        const type = U.txt(r, ['failure_type','FailureType','type'], 'Unknown');
        const cnt = U.val(r, ['failure_count','FailureCount'], 0);
        const prior = U.val(r, ['prior_month_count','PriorMonthCount'], 0);
        const momRawKey = U.key(r, ['mom_variance','MomVariance']);
        const mom = momRawKey ? U.n(r[momRawKey], 0) : cnt - prior;
        const arrow = mom > 0 ? '▲' : (mom < 0 ? '▼' : '—');
        const color = mom > 0 ? '#EF1435' : (mom < 0 ? '#12C7A3' : '#65697B');
        const bg = mom > 0 ? 'rgba(239,20,53,.10)' : (mom < 0 ? 'rgba(18,199,163,.10)' : 'rgba(255,255,255,.42)');
        const tip = `${type}: prior ${U.fmt0(prior)} | ${label} ${U.fmt0(cnt)} | MoM ${U.signed0(mom)}`;
        return `<tr class="data-row" data-tip="${U.esc(tip)}" style="background:${bg};"><td class="type">${U.esc(type)}</td><td class="num">${U.fmt0(prior)}</td><td class="num current">${U.fmt0(cnt)}</td><td class="num delta" style="color:${color};">${arrow} ${U.signed0(mom)}</td></tr>`;
      }).join('');
    }
    U.root.innerHTML = `<div class="kb4-card" style="--deltaColor:${deltaColor};"><div class="head"><div class="title">Phishing Failure Types - MoM</div><div class="pill">${U.esc(label)}</div></div><div class="summary"><div class="tile"><div class="lab">Current</div><div class="val">${U.fmt0(currentTotal)}</div></div><div class="tile"><div class="lab">Prior</div><div class="val">${U.fmt0(priorTotal)}</div></div><div class="tile"><div class="lab">MoM</div><div class="val deltaTop">${U.signed0(delta)}</div></div></div><table><thead><tr><th>Failure Type</th><th>Prior</th><th>${U.esc(label)}</th><th>MoM</th></tr></thead><tbody>${body}</tbody></table><div class="foot"><span>Last completed month</span><span>${U.ymd(reportStart)} to ${U.ymd(reportEnd)}</span></div></div>`;
  }
  U.receive(render);
})();
</script></body></html>
