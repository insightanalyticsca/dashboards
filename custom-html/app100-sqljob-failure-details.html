<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty{height:100%;display:grid;place-items:center;color:#5b6171;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.36);border:1px dashed rgba(16,20,111,.18);border-radius:14px}.card{width:100%;height:100%;background:radial-gradient(circle at 90% 12%,rgba(255,107,120,.18),transparent 30%),linear-gradient(135deg,rgba(255,255,255,.88),rgba(226,230,236,.78));border:1px solid rgba(16,20,111,.13);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px rgba(16,20,111,.12);padding:9px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.title{font-size:13px;font-weight:950;letter-spacing:-.02em}.pill{font-size:9px;font-weight:900;border:1px solid rgba(214,69,80,.28);background:rgba(255,255,255,.64);border-radius:999px;padding:3px 7px;color:#D64550}.body{height:calc(100% - 30px);overflow:auto;padding-right:3px}.fail{background:rgba(255,255,255,.52);border:1px solid rgba(214,69,80,.18);border-left:4px solid #D64550;border-radius:11px;padding:7px;margin-bottom:7px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}.fail:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(214,69,80,.12)}.top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}.jn{font-size:10.5px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{font-size:8.5px;color:#64748B;font-weight:850;margin-top:2px}.dur{font-size:9px;font-weight:950;color:#10146F;background:rgba(16,20,111,.06);border-radius:999px;padding:3px 6px;white-space:nowrap}.narr{font-size:9.5px;font-weight:850;color:#334155;line-height:1.32;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.detail{display:none;margin-top:7px;border-top:1px solid rgba(16,20,111,.10);padding-top:7px}.fail.open .detail{display:block}.msg{white-space:pre-wrap;font:10.5px/1.35 Consolas,monospace;color:#1e293b;background:rgba(16,20,111,.04);border-radius:9px;padding:8px;border:1px solid rgba(16,20,111,.07)}.body::-webkit-scrollbar{width:7px}.body::-webkit-scrollbar-thumb{background:rgba(16,20,111,.18);border-radius:99px}.oknote{height:calc(100% - 30px);display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.48);border:1px solid rgba(9,166,125,.18);border-radius:12px;color:#09A77D;font-weight:950;font-size:12px}.small{font-size:9px;color:#64748B;font-weight:850;margin-top:5px}
</style></head><body><div id="root"><div class="empty">Waiting for live SQL Agent failure rows...</div></div><script>
const U=(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rowsOf=p=>Array.isArray(p?.data)?p.data:Array.isArray(p?.result?.data)?p.result.data:Array.isArray(p?.payload?.data)?p.payload.data:Array.isArray(p?.rows)?p.rows:[];const k=(r,n)=>{const m={};Object.keys(r||{}).forEach(x=>m[x.toLowerCase()]=x);for(const x of n){const hit=m[String(x).toLowerCase()];if(hit)return hit}return''};const get=(r,n,fb='')=>{const x=k(r,n);return x?(r[x]??fb):fb};const num=(v,fb=0)=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:fb};const dt=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};return{esc,rowsOf,get,num,dt}})();
function narrate(r){const job=U.get(r,['display_name','job_name'],'SQL job');const fs=U.get(r,['failed_steps_text'],'');const msg=U.get(r,['outcome_message'],'');if(fs)return `${job} failed in ${fs.split('\n')[0]}.`;if(msg)return `${job} failed: ${msg.slice(0,180)}`;return `${job} failed. No detailed SQL Agent message was returned.`}
function render(payload){const rows=U.rowsOf(payload).slice();if(!rows.length){document.getElementById('root').innerHTML='<div class="card"><div class="head"><div class="title">APP100 SQL Job Failure Detail</div><div class="pill">latest failures</div></div><div class="oknote"><div>No recent SQL Agent failures returned.<div class="small">View uses msdb job history; history retention may limit the lookback.</div></div></div></div>';return}rows.sort((a,b)=>U.num(U.get(a,['failure_rank']),9999)-U.num(U.get(b,['failure_rank']),9999));const list=rows.slice(0,25).map((r,i)=>{const job=U.get(r,['display_name','job_name'],'SQL job'),steps=U.get(r,['failed_steps_text'],'')||'(no failed step details)',all=U.get(r,['step_messages_text'],'')||'',msg=U.get(r,['outcome_message'],'')||'';return `<div class="fail" onclick="this.classList.toggle('open')"><div class="top"><div><div class="jn" title="${U.esc(U.get(r,['job_name']))}">${U.esc(job)}</div><div class="when">${U.esc(U.dt(U.get(r,['run_start_time'])))} · ${U.esc(U.get(r,['host_name']))}</div></div><div class="dur">${U.esc(U.get(r,['duration_text']))}</div></div><div class="narr">${U.esc(narrate(r))}</div><div class="detail"><div class="msg">FAILED STEPS\n${U.esc(steps)}\n\nSTEP DETAIL\n${U.esc(all || '(no step detail)')}\n\nJOB MESSAGE\n${U.esc(msg || '(no message returned)')}</div></div></div>`}).join('');document.getElementById('root').innerHTML=`<div class="card"><div class="head"><div class="title">APP100 SQL Job Failure Detail</div><div class="pill">${rows.length} failures in history view</div></div><div class="body">${list}</div></div>`}
window.addEventListener('message',e=>{if(!e.data||!String(e.data.type||'').startsWith('dashboard-custom-html:')||String(e.data.type||'').endsWith(':resize'))return;render(e.data.payload||e.data||{})});
</script><!-- Pull-to-refresh + service worker -->
<script src="../js/pull-to-refresh.js?v=20260808"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../service-worker.js').catch(function() {});
    });
  }
</script>
</body></html>
