</head><body><div id="root"><div class="empty">Waiting for live SQL Agent duration rows...</div></div><script>
const U=(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rowsOf=p=>Array.isArray(p?.data)?p.data:Array.isArray(p?.result?.data)?p.result.data:Array.isArray(p?.payload?.data)?p.payload.data:Array.isArray(p?.rows)?p.rows:[];const k=(r,n)=>{const m={};Object.keys(r||{}).forEach(x=>m[x.toLowerCase()]=x);for(const x of n){const hit=m[String(x).toLowerCase()];if(hit)return hit}return''};const get=(r,n,fb='')=>{const x=k(r,n);return x?(r[x]??fb):fb};const num=(v,fb=0)=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:fb};const dt=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString(undefined,{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})};const dur=s=>{s=Math.max(0,Math.round(num(s,0)));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h?`${h}:`:'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};return{esc,rowsOf,get,num,dt,dur}})();
let chart=null;function render(payload){const rows=U.rowsOf(payload).slice();if(!rows.length){document.getElementById('root').innerHTML='<div class="empty">No duration rows returned from SQL Agent history.</div>';return}document.getElementById('root').innerHTML='<div class="card"><div class="head"><div class="title">APP100 SQL Job Duration Trend</div><div class="pill">latest 30 runs per job</div></div><div id="chart"></div></div>';if(!window.echarts){document.getElementById('chart').innerHTML='<div class="fallback">ECharts did not load. Check CDN or install echarts locally.</div>';return}rows.sort((a,b)=>U.num(U.get(a,['sort_order']),9999)-U.num(U.get(b,['sort_order']),9999)||String(U.get(a,['display_name','job_name'])).localeCompare(String(U.get(b,['display_name','job_name'])))||U.num(U.get(b,['run_rank']),0)-U.num(U.get(a,['run_rank']),0));const byJob=new Map();rows.forEach(r=>{const k=U.get(r,['job_id'])||U.get(r,['job_name']);if(!byJob.has(k))byJob.set(k,{name:U.get(r,['display_name','job_name']),rows:[]});byJob.get(k).rows.push(r)});const jobs=[...byJob.values()].slice(0,10);const maxLen=Math.max(...jobs.map(j=>j.rows.length),1);const x=Array.from({length:maxLen},(_,i)=>`-${maxLen-i-1}`);const series=jobs.map(j=>({name:j.name,type:'line',smooth:true,symbol:'circle',symbolSize:5,showSymbol:false,emphasis:{focus:'series'},data:j.rows.map(r=>({value:U.num(U.get(r,['duration_minutes']),0),_row:r,itemStyle:Number(U.get(r,['is_failed']))?{color:'#D64550'}:Number(U.get(r,['is_warning']))?{color:'#E6A700'}:undefined}))}));chart=echarts.init(document.getElementById('chart'),null,{renderer:'canvas'});chart.setOption({animation:true,grid:{left:34,right:12,top:22,bottom:30},tooltip:{trigger:'item',confine:true,backgroundColor:'rgba(7,10,41,.92)',borderWidth:0,textStyle:{color:'#fff',fontSize:10,fontWeight:700},formatter:p=>{const r=p.data._row||{};return `${U.esc(p.seriesName)}<br/>${U.esc(U.get(r,['run_status_label']))} · ${U.esc(U.dt(U.get(r,['run_start_time'])))}<br/>Duration: ${U.esc(U.get(r,['duration_text'])||U.dur(U.get(r,['duration_seconds'])))}<br/>Run rank: ${U.esc(U.get(r,['run_rank']))}`}},legend:{type:'scroll',top:0,left:0,right:0,itemWidth:10,itemHeight:6,textStyle:{fontSize:9,color:'#334155'}},xAxis:{type:'category',data:x,axisTick:{show:false},axisLabel:{fontSize:9,color:'#64748B'},axisLine:{lineStyle:{color:'rgba(16,20,111,.18)'}}},yAxis:{type:'value',name:'min',nameTextStyle:{fontSize:9,color:'#64748B'},axisLabel:{fontSize:9,color:'#64748B'},splitLine:{lineStyle:{color:'rgba(16,20,111,.08)'}}},series});window.addEventListener('resize',()=>chart&&chart.resize(),{once:false})}
window.addEventListener('message',e=>{if(!e.data||!String(e.data.type||'').startsWith('dashboard-custom-html:')||String(e.data.type||'').endsWith(':resize'))return;render(e.data.payload||e.data||{})});
