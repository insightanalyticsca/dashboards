<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
  --c0:#0808EE; --c1:#09C698; --c2:#171777; --c3:#c9c9c9; --c4:#d4d4d9;
  --c5:#BBFF05; --c6:#4F63F7; --c7:#12DDB8; --c8:#635BCB; --c9:#DDF76D;
  --ink:#171777; --muted:#66719a; --line:#d8dbe8; --bg:#f3f4f8; --tile:#ffffff;
  --good:#09C698; --bad:#ef5350; --black:#111111;
}
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Inter,Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
.tile{
  width:100%;height:100%;background:var(--tile);border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(255,255,255,.65) inset;overflow:hidden;position:relative
}
.topbar{padding:8px 12px 0 12px}
.title{font-size:13px;line-height:1.15;font-weight:800;color:var(--ink);letter-spacing:.1px}
.menu{position:absolute;top:10px;right:10px;color:#c6c8d4;font-size:16px;line-height:1}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 12px 0 12px}
.legend-item{display:inline-flex;gap:6px;align-items:center;font-size:10px;font-weight:700;color:#586180}
.dot{width:10px;height:10px;border-radius:50%}
.body{padding:6px 10px 10px 10px;height:calc(100% - 34px)}
.chart{width:100%;height:100%}
.empty{height:100%;display:grid;place-items:center;color:var(--ink);font-size:12px;font-weight:700}
.table-wrap{padding:8px 10px 10px 10px;height:calc(100% - 32px)}
.pbix-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
.pbix-table th,.pbix-table td{border:1px solid #c8cbda;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbix-table thead th{background:#1c1d8a;color:#fff;font-weight:800}
.pbix-table tbody th{background:#1c1d8a;color:#fff;text-align:left;font-weight:800}
.pbix-table tbody td{background:#d7d8df;color:var(--ink);text-align:right}
.pbix-table tbody tr.delta td{font-weight:800}
.pbix-table tbody tr.delta td.good{color:var(--good)}
.pbix-table tbody tr.delta td.bad{color:var(--bad)}
.pbix-table .left{text-align:left}
.kpi{
  display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;
  height:100%;padding:10px 12px 12px 12px
}
.kpi-title{font-size:12px;font-weight:800;color:var(--ink);line-height:1.2}
.kpi-value{font-size:34px;font-weight:900;letter-spacing:-1px;color:var(--ink);line-height:.95;margin-top:8px}
.kpi-caption{font-size:11px;font-weight:700;color:var(--muted);margin-top:8px}
.kpi-delta{font-size:12px;font-weight:800;margin-top:8px}
.kpi-delta.good{color:var(--good)} .kpi-delta.bad{color:var(--bad)}
.info-rotator{margin-top:10px;min-height:30px;font-size:11px;color:var(--muted);font-weight:700}
.kpi-right{display:grid;grid-template-rows:110px 44px;gap:8px;align-items:center}
.card-chart,.spark{width:100%;height:100%}
.section-grid{display:grid;grid-template-columns:1.2fr .9fr;gap:10px;height:calc(100% - 32px);padding:8px 10px 10px 10px}
.mini-card{border:1px solid var(--line);background:#fbfcff;padding:8px 10px;border-radius:8px}
.mini-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.mini-value{font-size:22px;font-weight:900;color:var(--ink);margin-top:4px}
.list{display:flex;flex-direction:column;gap:7px}
.list-row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:11px}
.small{font-size:11px;color:var(--muted);font-weight:700}
.big-center{display:grid;place-items:center;height:100%;text-align:center}
.health-grid{display:grid;grid-template-columns:132px 1fr;gap:10px;height:calc(100% - 32px);padding:8px 10px 10px 10px}
.health-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.health-chip{border:1px solid var(--line);background:#fbfcff;border-radius:8px;padding:6px 8px}
.health-chip .cap{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.health-chip .val{font-size:14px;font-weight:900;color:var(--ink);margin-top:3px}
.health-table{display:flex;flex-direction:column;gap:6px;max-height:100%;overflow:auto;padding-right:2px}
.health-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #eef1f7;padding-bottom:6px}
.pill{padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800}
.pill.good{background:rgba(9,198,152,.12);color:var(--good)} .pill.bad{background:rgba(239,83,80,.12);color:var(--bad)} .pill.warn{background:rgba(251,192,45,.15);color:#9b7a00}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CORPORATE=["#0808EE","#09C698","#171777","#c9c9c9","#d4d4d9","#BBFF05","#4F63F7","#12DDB8","#635BCB","#DDF76D"];
function n(v){ if (typeof v==='number') return Number.isFinite(v)?v:0; const s=String(v??'').replace(/[$,%\s,]/g,''); const x=Number(s); return Number.isFinite(x)?x:0; }
function rowsOf(v){
  if (Array.isArray(v)) return v;
  if (!v) return [];
  if (Array.isArray(v.rows)) return v.rows;
  if (Array.isArray(v.data)) return v.data;
  if (Array.isArray(v.items)) return v.items;
  if (Array.isArray(v.result)) return v.result;
  if (Array.isArray(v.result?.rows)) return v.result.rows;
  if (Array.isArray(v.result?.data)) return v.result.data;
  if (Array.isArray(v.payload?.rows)) return v.payload.rows;
  if (Array.isArray(v.payload?.data)) return v.payload.data;
  if (Array.isArray(v.model?.rows)) return v.model.rows;
  if (Array.isArray(v.model?.data)) return v.model.data;
  return [];
}
function extract(source){
  const base = source || window.DashVisualContext || {};
  const payload = base.payload || {};
  const model = payload.model || base.model || {};
  const config = payload.config || base.config || {};
  const meta = payload.meta || base.meta || {};
  const rows = rowsOf(model).length ? rowsOf(model) : rowsOf(payload).length ? rowsOf(payload) : rowsOf(base);
  return { base, payload, model, config, meta, rows };
}
function keyOf(obj, keys){
  if (!obj) return '';
  const map = {};
  Object.keys(obj).forEach(k => map[k.toLowerCase()] = k);
  for (const name of keys){ const hit = map[String(name).toLowerCase()]; if (hit) return hit; }
  return '';
}
function pick(obj, keys, fallback=''){ const k = keyOf(obj, keys); return k ? obj[k] : fallback; }
function monthStart(v){ const d=new Date(v); return Number.isFinite(d.getTime()) ? new Date(d.getFullYear(), d.getMonth(), 1) : null; }
function monthLabel(v){ const d=v instanceof Date ? v : monthStart(v); return d ? d.toLocaleDateString(undefined,{month:'short'}) : String(v??''); }
function shortFmt(value, digits=0){
  const abs = Math.abs(n(value));
  if (abs >= 1000000) return (n(value)/1000000).toFixed(abs >= 10000000 ? 0 : 1).replace(/\.0$/,'') + 'M';
  if (abs >= 1000) return (n(value)/1000).toFixed(abs >= 100000 ? 0 : 1).replace(/\.0$/,'') + 'K';
  return n(value).toLocaleString(undefined,{maximumFractionDigits:digits,minimumFractionDigits:digits});
}
function moneyFmt(value, digits=0){ return n(value).toLocaleString(undefined,{maximumFractionDigits:digits,minimumFractionDigits:digits}); }
function pctFmt(value, digits=2){ return (n(value)).toFixed(digits).replace(/\.00$/,'') + '%'; }
function canonicalBucket(v){
  const s = String(v??'').toLowerCase();
  if (!s) return '';
  if (s.includes('current') || s.includes('0-30') || s.includes('1-30') || s === '30') return '0-30';
  if (s.includes('31-60')) return '31-60';
  if (s.includes('61-90')) return '61-90';
  if (s.includes('>90') || s.includes('91-') || s.includes('120') || s.includes('90+')) return '>90';
  return String(v);
}
function sortPeriodStrings(values){
  return [...values].sort((a,b)=>{
    const da = new Date(a); const db = new Date(b);
    const va = Number.isFinite(da.getTime()) ? da.getTime() : String(a);
    const vb = Number.isFinite(db.getTime()) ? db.getTime() : String(b);
    return va < vb ? -1 : va > vb ? 1 : 0;
  });
}
function infoTexts(rows){
  const texts=[];
  rows.forEach(row=>{
    ['InfoText','Info','Description','Detail','Summary','AltText1','AltText2','AltText3','SecondaryText','TertiaryText'].forEach(name=>{
      const key=keyOf(row,[name]);
      const value=key ? String(row[key]??'').trim() : '';
      if (value && !texts.includes(value)) texts.push(value);
    });
  });
  return texts;
}
function onDashMessages(render, resize){
  function handle(source){ try{ render(source); } catch(err){ console.warn('custom html render failed', err); } }
  window.addEventListener('message', ev => {
    const type = String(ev?.data?.type || '');
    if (!type.startsWith('dashboard-custom-html:')) return;
    if (type.endsWith(':resize')) { if (resize) resize(); return; }
    if (type.endsWith(':init') || type.endsWith(':update')) handle(ev.data);
  });
  window.addEventListener('resize', ()=>{ if (resize) resize(); });
  handle(window.DashVisualContext || {});
}

const TITLE = "Bankruptcies";
function render(source){
  const {rows} = extract(source);
  document.getElementById('root').innerHTML = `
    <div class="tile">
      <div class="topbar"><div class="title">${TITLE}</div></div>
      <div class="table-wrap"><div id="tableHost" style="height:100%"></div></div>
    </div>`;
  if (!rows.length){ document.getElementById('tableHost').innerHTML = '<div class="empty">No SQL data.</div>'; return; }
  const first = rows[0];
  const typeKey = keyOf(first, ['Type','Category','Name']);
  const metricKey = keyOf(first, ['Metric','Measure','Bucket']);
  const valueKey = keyOf(first, ['Value','Amount','Total','Count']);
  if (!typeKey || !metricKey || !valueKey){ document.getElementById('tableHost').innerHTML = '<div class="empty">SQL columns missing.</div>'; return; }

  const metricOrder = ['Month #','Month $','YTD #','YTD $'];
  const types = [];
  const map = new Map();
  rows.forEach(row => {
    const type = String(row[typeKey] ?? '').trim();
    const metric = String(row[metricKey] ?? '').trim();
    if (!type || !metric) return;
    if (!types.includes(type)) types.push(type);
    if (!map.has(type)) map.set(type, {});
    map.get(type)[metric] = n(row[valueKey]);
  });

  const header = metricOrder.map(metric => `<th>${metric}</th>`).join('');
  const body = types.map(type => {
    const metrics = map.get(type) || {};
    const cells = metricOrder.map(metric => `<td>${moneyFmt(metrics[metric],0)}</td>`).join('');
    return `<tr><th class="left">${type}</th>${cells}</tr>`;
  }).join('');

  document.getElementById('tableHost').innerHTML = `
    <table class="pbix-table">
      <thead>
        <tr>
          <th class="left" style="width:34%">Type</th>
          ${header}
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>`;
}
onDashMessages(render);

</script>
<!-- Pull-to-refresh + service worker -->
<script src="../js/pull-to-refresh.js?v=20260808"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../service-worker.js').catch(function() {});
    });
  }
</script>
</body>
</html>
