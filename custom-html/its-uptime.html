<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty-state{width:100%;height:100%;display:grid;place-items:center;color:#65697B;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.45);border-radius:8px;padding:12px 5px}.tiny-error{color:#9f1239;font-size:10px;font-weight:800;white-space:pre-wrap;text-align:left}.its-card{width:100%;height:100%;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,rgba(255,255,255,.80),rgba(226,230,236,.74));border:1px solid rgba(16,20,111,.14);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 10px 24px rgba(16,20,111,.12);padding:7px 8px 6px 8px;overflow:hidden;color:#10146F}.its-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.its-title{font-size:12px;font-weight:800;line-height:1;color:#10146F;white-space:nowrap}.its-pill{font-size:9px;font-weight:800;color:#10146F;background:rgba(255,255,255,.62);border:1px solid rgba(16,20,111,.11);border-radius:999px;padding:3px 7px;white-space:nowrap}.its-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:5px}.k{background:rgba(255,255,255,.55);border:1px solid rgba(16,20,111,.08);border-radius:10px;padding:4px 6px;min-width:0}.kl{font-size:8px;color:#65697B;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.kv{font-size:14px;font-weight:900;color:#10146F;line-height:1.1}.main-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px;line-height:1.05}th{background:#10146F;color:white;padding:5px 6px;text-align:left;font-weight:900;border-right:1px solid rgba(255,255,255,.18)}th:nth-child(1){width:43%}th:nth-child(2){width:19%;text-align:right}th:nth-child(3){width:19%;text-align:right}th:nth-child(4){width:19%}.cat-row td{background:#10146F;color:white;font-weight:900;padding:5px 7px;border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.35);white-space:nowrap}.fake-toggle{display:inline-block;width:16px;margin-right:4px;opacity:.95}.svc-row{position:relative}.svc-row td{background:rgba(210,210,214,.92);color:#10146F;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.55);white-space:nowrap}.svc-row:hover td{filter:brightness(.985)}.svc-row:hover::after{content:attr(data-tip);position:absolute;right:4px;top:-28px;max-width:300px;padding:6px 8px;border-radius:9px;background:rgba(16,20,111,.94);color:#fff;font-size:9px;font-weight:800;line-height:1.25;box-shadow:0 8px 18px rgba(16,20,111,.22);z-index:30;pointer-events:none;white-space:normal}.svc-row td:nth-child(1){width:43%}.svc-row td:nth-child(2){width:19%}.svc-row td:nth-child(3){width:19%}.svc-row td:nth-child(4){width:19%}.indent{padding-left:26px!important}.svc{color:#10146F;font-weight:500;overflow:hidden;text-overflow:ellipsis}.num{text-align:right;font-variant-numeric:tabular-nums}.stat{font-weight:700;overflow:hidden;text-overflow:ellipsis}.status-icon{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(16,20,111,.35)}.circle{border-radius:99px}.triangle{width:0;height:0;background:transparent!important;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #E6A42D;border-top:0;border-radius:0;vertical-align:-2px}.empty{text-align:center;color:#65697B;font-size:10px;font-weight:800;background:rgba(255,255,255,.45);border-radius:8px;padding:12px 5px}.foot{margin-top:5px;font-size:8.5px;color:#10146F;font-weight:800;line-height:1.25}
</style></head><body><div id="root"><div class="empty-state">Waiting for live data...</div></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('root');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt0 = v => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(Number.isFinite(Number(v)) ? Number(v) : 0);
  const fmtPct0 = v => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(Number.isFinite(Number(v)) ? Number(v) : 0) + '%';
  const fmt1 = v => (Number.isFinite(Number(v)) ? Number(v) : 0).toFixed(1);
  const fmt3 = v => (Number.isFinite(Number(v)) ? Number(v) : 0).toFixed(3);
  const signed0 = v => { const n = Number.isFinite(Number(v)) ? Number(v) : 0; return n > 0 ? '+' + fmt0(n) : fmt0(n); };
  const n = (v, fb = 0) => {
    if (v === null || v === undefined || v === '') return fb;
    if (typeof v === 'number') return Number.isFinite(v) ? v : fb;
    const x = Number(String(v).replace(/,/g, '').replace(/%/g, '').trim());
    return Number.isFinite(x) ? x : fb;
  };
  const key = (row, names) => {
    if (!row) return '';
    const map = {};
    for (const k of Object.keys(row)) map[k.toLowerCase()] = k;
    for (const nm of names) {
      const hit = map[String(nm).toLowerCase()];
      if (hit) return hit;
    }
    return '';
  };
  const txt = (row, names, fb = '') => {
    const k = key(row, names);
    const v = k ? row[k] : fb;
    return v === null || v === undefined ? fb : String(v);
  };
  const val = (row, names, fb = 0) => {
    const k = key(row, names);
    return k ? n(row[k], fb) : fb;
  };
  const rowsOf = p => {
    if (Array.isArray(p?.data)) return p.data.filter(Boolean);
    if (Array.isArray(p?.payload?.data)) return p.payload.data.filter(Boolean);
    if (Array.isArray(p?.result?.data)) return p.result.data.filter(Boolean);
    if (Array.isArray(p?.model?.data)) return p.model.data.filter(Boolean);
    if (Array.isArray(p?.model?.rows)) return p.model.rows.filter(Boolean);
    return [];
  };
  function parseDate(v) {
    if (v instanceof Date && !Number.isNaN(v.getTime())) return v;
    if (v === null || v === undefined || v === '') return null;
    const s = String(v).trim();
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    const d = new Date(s);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function monthKey(v) {
    const d = parseDate(v);
    if (!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function monthStartKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
  function addMonths(d, m) { return new Date(d.getFullYear(), d.getMonth() + m, 1); }
  function lastCompletedMonthStart(now = new Date()) { return new Date(now.getFullYear(), now.getMonth() - 1, 1); }
  function monthLabel(d) { return d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }
  function monthShort(d) { return d.toLocaleDateString(undefined, { month: 'short' }); }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function setEmpty(message) { root.innerHTML = `<div class="empty-state">${esc(message)}</div>`; }
  function setError(err) { root.innerHTML = `<div class="empty-state tiny-error">${esc(err && err.stack ? err.stack : err)}</div>`; }
  function receive(render) {
    window.addEventListener('message', e => {
      const type = String(e?.data?.type || '');
      if (!type.startsWith('dashboard-custom-html:')) return;
      if (type.endsWith(':resize')) return;
      try { render(e.data.payload || e.data || {}); } catch (err) { setError(err); }
    });
  }
  window.ITS_LIVE = { root, esc, fmt0, fmtPct0, fmt1, fmt3, signed0, n, key, txt, val, rowsOf, parseDate, monthKey, monthStartKey, firstOfMonth, endOfMonth, addMonths, lastCompletedMonthStart, monthLabel, monthShort, ymd, setEmpty, setError, receive };
})();
</script>

<script>
(() => {
  const U = window.ITS_LIVE;
  function uptimeReportDates(rows) {
    const dates = rows.map(r => U.parseDate(U.txt(r, ['month_start','MonthStart','monthStart']))).filter(Boolean).sort((a,b)=>a-b);
    const latest = dates.length ? dates[dates.length - 1] : null;
    if (!latest) {
      const fallback = U.lastCompletedMonthStart();
      return { latest:null, reportStart:fallback, reportEnd:U.endOfMonth(fallback), currentRead:null };
    }
    const reportStart = latest.getDate() === 1 ? U.firstOfMonth(latest) : U.lastCompletedMonthStart(latest);
    const currentRead = latest && U.monthKey(latest) + '-' + String(latest.getDate()).padStart(2,'0') !== U.monthKey(reportStart) + '-01' ? latest : null;
    return { latest, reportStart, reportEnd:U.endOfMonth(reportStart), currentRead };
  }
  function statusColor(status) {
    return status === 'Met' ? '#59AE73' : (status === 'Marginal' ? '#E6A42D' : '#EF1435');
  }
  function render(payload) {
    const rows = U.rowsOf(payload);
    const dates = uptimeReportDates(rows);
    const reportKey = U.monthStartKey(dates.reportStart);
    const currentKey = dates.currentRead ? U.monthKey(dates.currentRead) : '';
    const base = rows.filter(r => {
      const mk = U.monthKey(U.txt(r, ['month_start','MonthStart','monthStart']));
      return mk === reportKey || (currentKey && mk === currentKey);
    });
    const data = base.map(r => ({
      category: U.txt(r, ['category','Category'], 'Uncategorized') || 'Uncategorized',
      service: U.txt(r, ['Service','service','friendly_name','service_name','url'], 'Service') || 'Service',
      up: U.val(r, ['uptime_pct','UptimePct','uptime'], 0),
      sla: U.val(r, ['sla_pct','SlaPct','target'], 99.999),
      status: U.txt(r, ['sla_breach_status','SlaBreachStatus','status'], 'Met') || 'Met'
    }));
    const met = data.filter(x => x.status === 'Met').length;
    const total = data.length;
    const watch = total - met;
    const metPct = total ? met / total * 100 : 0;
    const byCat = new Map();
    for (const x of data) {
      if (!byCat.has(x.category)) byCat.set(x.category, []);
      byCat.get(x.category).push(x);
    }
    let body = '';
    if (!total) {
      body = `<tr><td colspan="4" class="empty">No UptimeRobot rows found for ${U.esc(U.monthLabel(dates.reportStart))}</td></tr>`;
    } else {
      body = [...byCat.keys()].sort((a,b)=>a.localeCompare(b)).map(cat => {
        const svcs = byCat.get(cat).sort((a,b)=>a.service.localeCompare(b.service)).map(x => {
          const color = statusColor(x.status);
          const icon = x.status === 'Marginal' ? 'triangle' : 'circle';
          const tip = `${x.service}: uptime ${U.fmt3(x.up)}% | SLA ${U.fmt3(x.sla)}% | ${x.status}`;
          return `<tr class="svc-row" data-tip="${U.esc(tip)}"><td class="svc indent">${U.esc(x.service)}</td><td class="num">${U.fmt3(x.up)}%</td><td class="num">${U.fmt3(x.sla)}%</td><td class="stat"><span class="status-icon ${icon}" style="background:${color};"></span>${U.esc(x.status)}</td></tr>`;
        }).join('');
        return `<tr class="cat-row"><td colspan="4"><span class="fake-toggle">⊟</span>${U.esc(cat)}</td></tr>${svcs}`;
      }).join('');
    }
    const label = U.monthLabel(dates.reportStart);
    U.root.innerHTML = `<div class="its-card"><div class="its-head"><div class="its-title">Uptime % - ${U.esc(label)}</div><div class="its-pill">DirectQuery · UptimeRobot</div></div><div class="its-kpis"><div class="k"><div class="kl">Services</div><div class="kv">${U.fmt0(total)}</div></div><div class="k"><div class="kl">Met SLA</div><div class="kv">${U.fmtPct0(metPct)}</div></div><div class="k"><div class="kl">Watch</div><div class="kv">${U.fmt0(watch)}</div></div></div><table class="main-table"><thead><tr><th>Category</th><th>Uptime %</th><th>SLA %</th><th>SLA Breach</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  U.receive(render);
})();
</script><!-- Pull-to-refresh + service worker -->
<script src="../js/pull-to-refresh.js?v=20260808"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../service-worker.js').catch(function() {});
    });
  }
</script>
