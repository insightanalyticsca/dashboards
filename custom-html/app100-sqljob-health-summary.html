<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#10146F}*{box-sizing:border-box}.empty{height:100%;display:grid;place-items:center;color:#5b6171;font-size:10px;font-weight:850;text-align:center;background:rgba(255,255,255,.36);border:1px dashed rgba(16,20,111,.18);border-radius:14px}.card{width:100%;height:100%;background:radial-gradient(circle at 92% 10%,rgba(188,237,22,.26),transparent 26%),linear-gradient(135deg,rgba(255,255,255,.88),rgba(226,230,236,.78));border:1px solid rgba(16,20,111,.13);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px rgba(16,20,111,.12);padding:9px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.title{font-size:13px;font-weight:950;letter-spacing:-.02em}.pill{font-size:9px;font-weight:900;border:1px solid rgba(16,20,111,.12);background:rgba(255,255,255,.62);border-radius:999px;padding:3px 7px;color:#10146F}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}.kpi{background:rgba(255,255,255,.56);border:1px solid rgba(16,20,111,.08);border-radius:10px;padding:6px 7px;min-width:0}.kl{font-size:8px;color:#64748B;font-weight:900;white-space:nowrap}.kv{font-size:18px;font-weight:950;line-height:1.05;color:#10146F;margin-top:1px}.kv.bad{color:#D64550}.jobs{height:calc(100% - 88px);overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;padding-right:2px}.job{background:rgba(255,255,255,.48);border:1px solid rgba(16,20,111,.08);border-radius:11px;padding:7px;min-width:0;position:relative}.job.bad{border-color:rgba(214,69,80,.42);box-shadow:inset 4px 0 0 #D64550}.job.warn{border-color:rgba(230,167,0,.35);box-shadow:inset 4px 0 0 #E6A700}.job.ok{box-shadow:inset 4px 0 0 #09A77D}.jn{font-size:10px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}.meta{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:8.5px;font-weight:850;color:#64748B}.meta strong{color:#10146F}.bar{height:8px;background:rgba(16,20,111,.10);border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#09A77D,#25D7A6)}.failfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#D64550,#FF6B78)}.tip{position:absolute;inset:auto 7px 7px 7px;display:none;background:rgba(7,10,41,.92);color:#fff;border-radius:8px;padding:7px;font-size:9px;line-height:1.3;font-weight:800;z-index:5;white-space:pre-wrap}.job:hover .tip{display:block}.jobs::-webkit-scrollbar{width:7px}.jobs::-webkit-scrollbar-thumb{background:rgba(16,20,111,.18);border-radius:99px}
</style></head><body><div id="root"><div class="empty">Waiting for live SQL Agent job summary...</div></div><script>
const U=(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rowsOf=p=>Array.isArray(p?.data)?p.data:Array.isArray(p?.result?.data)?p.result.data:Array.isArray(p?.payload?.data)?p.payload.data:Array.isArray(p?.rows)?p.rows:[];const k=(r,n)=>{const m={};Object.keys(r||{}).forEach(x=>m[x.toLowerCase()]=x);for(const x of n){const hit=m[String(x).toLowerCase()];if(hit)return hit}return''};const get=(r,n,fb='')=>{const x=k(r,n);return x?(r[x]??fb):fb};const num=(v,fb=0)=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:fb};const fmt=n=>new Intl.NumberFormat().format(num(n,0));const pct=n=>num(n,0).toFixed(1)+'%';const dt=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};const dur=s=>{s=Math.max(0,Math.round(num(s,0)));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h?`${h}:`:'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};return{esc,rowsOf,get,num,fmt,pct,dt,dur}})();
function statusClass(s){s=Number(s);if(s===0)return'bad';if(s===2||s===3||s===4)return'warn';return'ok'}
function render(payload){const rows=U.rowsOf(payload).slice();if(!rows.length){document.getElementById('root').innerHTML='<div class="empty">No SQL Agent summary rows returned.</div>';return}rows.sort((a,b)=>U.num(U.get(a,['sort_order']),9999)-U.num(U.get(b,['sort_order']),9999)||String(U.get(a,['display_name','job_name'])).localeCompare(String(U.get(b,['display_name','job_name']))));const jobs=rows.length,failedNow=rows.filter(r=>U.num(U.get(r,['last_run_status']))===0).length,avgSuccess=rows.reduce((a,r)=>a+U.num(U.get(r,['success_rate_pct']),0),0)/Math.max(1,jobs),fail50=rows.reduce((a,r)=>a+U.num(U.get(r,['failure_count']),0),0);const cards=rows.map(r=>{const sr=U.num(U.get(r,['success_rate_pct']),0),fr=U.num(U.get(r,['failure_rate_pct']),0),cls=statusClass(U.get(r,['last_run_status']));const msg=U.get(r,['last_run_failed_steps'])||U.get(r,['last_run_message'])||'';return `<div class="job ${cls}"><div class="jn" title="${U.esc(U.get(r,['job_name']))}">${U.esc(U.get(r,['display_name','job_name']))}</div><div class="meta"><span>Last</span><strong>${U.esc(U.get(r,['last_run_status_label']))}</strong><span>Success rate</span><strong>${U.pct(sr)}</strong><span>Failures / 50</span><strong>${U.fmt(U.get(r,['failure_count']))}</strong><span>Avg duration</span><strong>${U.dur(U.get(r,['avg_duration_seconds']))}</strong><span>Last run</span><strong>${U.esc(U.dt(U.get(r,['last_run_time'])))}</strong></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,sr))}%"></div></div><div class="bar"><div class="failfill" style="width:${Math.max(0,Math.min(100,fr))}%"></div></div><div class="tip">${U.esc(msg || 'No failure message on latest run.')}</div></div>`}).join('');document.getElementById('root').innerHTML=`<div class="card"><div class="head"><div class="title">APP100 SQL Job Health</div><div class="pill">last 50 runs per job</div></div><div class="kpis"><div class="kpi"><div class="kl">Jobs</div><div class="kv">${U.fmt(jobs)}</div></div><div class="kpi"><div class="kl">Failed latest</div><div class="kv bad">${U.fmt(failedNow)}</div></div><div class="kpi"><div class="kl">Avg success</div><div class="kv">${U.pct(avgSuccess)}</div></div><div class="kpi"><div class="kl">Failures checked</div><div class="kv bad">${U.fmt(fail50)}</div></div></div><div class="jobs">${cards}</div></div>`}
window.addEventListener('message',e=>{if(!e.data||!String(e.data.type||'').startsWith('dashboard-custom-html:')||String(e.data.type||'').endsWith(':resize'))return;render(e.data.payload||e.data||{})});
</script><!-- Pull-to-refresh + service worker -->
<script src="../js/pull-to-refresh.js?v=20260808"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../service-worker.js').catch(function() {});
    });
  }
</script>
</body></html>
