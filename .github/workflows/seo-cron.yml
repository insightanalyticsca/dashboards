name: SEO Optimization Cron

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: seo
  cancel-in-progress: true

jobs:
  seo-optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO optimizer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node .github/scripts/seo-optimizer.mjs

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit SEO updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "SEO Bot"
          git config user.email "seo-bot@insightanalyticsca.github.io"
          git commit -m "chore(seo): automated meta tag + keyword optimization

          Generated by GitHub Actions SEO cron job.
          Analyzed site content with Groq LLM and applied:
          - Optimized meta descriptions
          - Updated page titles with target keywords
          - Added Open Graph tags for social sharing
          - Added structured data (JSON-LD)
          - Updated sitemap

          [skip ci]"
          git push

      - name: Trigger Pages deploy
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
