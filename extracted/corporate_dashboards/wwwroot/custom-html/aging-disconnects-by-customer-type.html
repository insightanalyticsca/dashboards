<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <style>
        :root {
            --ink: #171777;
            --muted: #66719a;
            --line: #d8dbe8;
            --tile: #ffffff;
            --c0: #09C698;
            --c1: #0808EE;
            --c2: #4F63F7;
            --c3: #BBFF05;
            --c4: #171777;
            --c5: #12DDB8;
            --c6: #635BCB;
            --c7: #DDF76D;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: Segoe UI,Inter,Arial,sans-serif;
            color: var(--ink);
        }

        * {
            box-sizing: border-box
        }

        .tile {
            width: 100%;
            height: 100%;
            background: var(--tile);
            border: 1px solid var(--line);
            overflow: hidden;
            position: relative;
            display: grid;
            grid-template-rows: auto minmax(0,1fr);
        }

        .topbar {
            padding: 5px 12px 0 12px;
            min-height: 18px;
        }

        .title {
            font-size: 13px;
            line-height: 1.05;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: .1px;
        }

        .menu {
            position: absolute;
            top: 6px;
            right: 10px;
            color: #c6c8d4;
            font-size: 16px;
            line-height: 1;
        }

        .body {
            min-height: 0;
            padding: 0 4px 0 4px;
        }

        .chart {
            width: 100%;
            height: 100%;
        }

        .state {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            background: #fff;
        }

        .state-inner {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            line-height: 1;
            font-weight: 800;
            color: var(--muted);
            max-width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spin {
            width: 10px;
            height: 10px;
            border: 2px solid #d9dbe6;
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .error-box {
            width: 100%;
            height: 100%;
            background: #fff7f7;
            color: #9b1c1c;
            padding: 8px;
            overflow: auto;
            font-size: 10px;
            line-height: 1.35;
            font-weight: 700;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        (function () {
            const TITLE = "Disconnects by Customer Type - EoM";

            const COLORS = [
                "#09C698",
                "#0808EE",
                "#4F63F7",
                "#BBFF05",
                "#171777",
                "#12DDB8",
                "#635BCB",
                "#DDF76D"
            ];

            let chart = null;
            let gotData = false;

            function root() {
                return document.getElementById("root");
            }

            function esc(value) {
                return String(value ?? "").replace(/[&<>"']/g, ch => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[ch]));
            }

            function disposeChart() {
                if (chart) {
                    try { chart.dispose(); } catch { }
                    chart = null;
                }
            }

            function showLoader(text) {
                disposeChart();
                root().innerHTML =
                    '<div class="state"><div class="state-inner">' +
                    '<span class="spin"></span><span>' + esc(text || "loading...") + '</span>' +
                    '</div></div>';
            }

            function showNoData(text) {
                if (gotData) return;
                disposeChart();
                root().innerHTML =
                    '<div class="state"><div class="state-inner">' +
                    '<span>' + esc(text || "no data") + '</span>' +
                    '</div></div>';
            }

            function showError(err) {
                disposeChart();
                const message = err && err.stack ? err.stack : String(err || "Unknown error");
                root().innerHTML = '<div class="error-box">' + esc(message) + '</div>';
            }

            function parseMaybeJson(value) {
                if (typeof value !== "string") return value;
                const s = value.trim();
                if (!s) return value;
                if (s[0] !== "{" && s[0] !== "[") return value;
                try { return JSON.parse(s); } catch { return value; }
            }

            function n(value) {
                if (typeof value === "number") return Number.isFinite(value) ? value : 0;
                const s = String(value ?? "").replace(/[$,%\s,]/g, "");
                const x = Number(s);
                return Number.isFinite(x) ? x : 0;
            }

            function moneyFmt(value, digits) {
                return n(value).toLocaleString(undefined, {
                    maximumFractionDigits: digits ?? 0,
                    minimumFractionDigits: digits ?? 0
                });
            }

            function keyOf(obj, keys) {
                if (!obj || typeof obj !== "object") return "";
                const map = {};
                Object.keys(obj).forEach(k => map[String(k).toLowerCase()] = k);

                for (const name of keys) {
                    const hit = map[String(name).toLowerCase()];
                    if (hit) return hit;
                }

                return "";
            }

            function looksLikePieRows(value) {
                if (!Array.isArray(value) || !value.length) return false;

                return value.some(row => {
                    if (!row || typeof row !== "object") return false;

                    const keys = Object.keys(row).map(k => k.toLowerCase());

                    const hasName =
                        keys.includes("type") ||
                        keys.includes("category") ||
                        keys.includes("name") ||
                        keys.includes("customertype") ||
                        keys.includes("customer type");

                    const hasValue =
                        keys.includes("value") ||
                        keys.includes("amount") ||
                        keys.includes("total") ||
                        keys.includes("count");

                    return hasName && hasValue;
                });
            }

            function findRows(value, depth, seen) {
                depth = depth || 0;
                seen = seen || [];

                value = parseMaybeJson(value);

                if (looksLikePieRows(value)) return value;

                if (!value || typeof value !== "object" || depth > 16) return [];

                for (let i = 0; i < seen.length; i++) {
                    if (seen[i] === value) return [];
                }
                seen.push(value);

                const preferred = [
                    "data", "rows", "records", "items",
                    "payload", "model", "result", "response", "body", "raw",
                    "source", "detail", "value", "values", "context"
                ];

                for (const key of preferred) {
                    if (Object.prototype.hasOwnProperty.call(value, key)) {
                        const found = findRows(value[key], depth + 1, seen);
                        if (found.length) return found;
                    }
                }

                for (const key of Object.keys(value)) {
                    const found = findRows(value[key], depth + 1, seen);
                    if (found.length) return found;
                }

                return [];
            }

            function hasExplicitEmptyRows(value, depth, seen) {
                depth = depth || 0;
                seen = seen || [];

                value = parseMaybeJson(value);

                if (!value || typeof value !== "object" || depth > 10) return false;

                for (let i = 0; i < seen.length; i++) {
                    if (seen[i] === value) return false;
                }
                seen.push(value);

                for (const key of ["data", "rows", "records", "items"]) {
                    if (Array.isArray(value[key]) && value[key].length === 0) return true;
                }

                for (const key of ["payload", "model", "result", "response", "body", "raw", "source", "detail", "context"]) {
                    if (value[key] && hasExplicitEmptyRows(value[key], depth + 1, seen)) return true;
                }

                return false;
            }

            function shadeColor(hex, amount) {
                const clean = String(hex).replace("#", "");
                const num = parseInt(clean, 16);

                let r = (num >> 16) + amount;
                let g = ((num >> 8) & 255) + amount;
                let b = (num & 255) + amount;

                r = Math.max(0, Math.min(255, r));
                g = Math.max(0, Math.min(255, g));
                b = Math.max(0, Math.min(255, b));

                return "#" + (b | (g << 8) | (r << 16)).toString(16).padStart(6, "0");
            }

            function lucidFill(color) {
                if (!window.echarts || !echarts.graphic) return color;

                return new echarts.graphic.RadialGradient(.35, .28, .85, [
                    { offset: 0, color: shadeColor(color, 70) },
                    { offset: .35, color: shadeColor(color, 24) },
                    { offset: .72, color: color },
                    { offset: 1, color: shadeColor(color, -18) }
                ]);
            }

            function cleanName(value) {
                return String(value ?? "")
                    .replace(/^Disconnects\s+/, "Disconnects ")
                    .replace(/^Bankruptcies\s+/, "Bankruptcies ")
                    .trim();
            }

            function buildPieData(rows) {
                if (!Array.isArray(rows) || !rows.length) {
                    throw new Error("No rows array reached visual. Expected Type/Category/Name and Value/Amount/Total/Count.");
                }

                const first = rows.find(r => r && typeof r === "object") || {};

                const nameKey = keyOf(first, [
                    "Type",
                    "Category",
                    "Name",
                    "CustomerType",
                    "Customer Type"
                ]);

                const valueKey = keyOf(first, [
                    "Value",
                    "Amount",
                    "Total",
                    "Count"
                ]);

                if (!nameKey || !valueKey) {
                    throw new Error(
                        "SQL columns missing. Need Type/Category/Name/CustomerType and Value/Amount/Total/Count. Available columns: " +
                        Object.keys(first).join(", ")
                    );
                }

                const grouped = new Map();

                rows.forEach(row => {
                    if (!row || typeof row !== "object") return;

                    const name = cleanName(row[nameKey]);
                    const value = n(row[valueKey]);

                    if (!name) return;
                    grouped.set(name, (grouped.get(name) || 0) + value);
                });

                return Array.from(grouped.entries())
                    .map(([name, value]) => ({ name, value }))
                    .filter(item => item.name && item.value > 0)
                    .sort((a, b) => b.value - a.value);
            }

            function renderPieRows(rows) {
                if (!window.echarts) {
                    throw new Error("ECharts failed to load. CDN may be blocked.");
                }

                const rawData = buildPieData(rows);

                if (!rawData.length) {
                    showNoData("no data");
                    return;
                }

                disposeChart();

                root().innerHTML =
                    '<div class="tile">' +
                    '<div class="topbar"><div class="title">' + esc(TITLE) + '</div></div>' +
                    '<div class="menu">≡</div>' +
                    '<div class="body"><div id="chart" class="chart"></div></div>' +
                    '</div>';

                const chartData = rawData.map((item, index) => {
                    const color = COLORS[index % COLORS.length];

                    return {
                        name: item.name,
                        value: item.value,
                        itemStyle: {
                            color: lucidFill(color),
                            borderColor: "#ffffff",
                            borderWidth: 2,
                            shadowBlur: 10,
                            shadowOffsetY: 2,
                            shadowColor: "rgba(23,23,119,.16)"
                        }
                    };
                });

                chart = echarts.init(document.getElementById("chart"));

                chart.setOption({
                    animationDuration: 550,
                    animationEasing: "cubicOut",
                    tooltip: {
                        trigger: "item",
                        backgroundColor: "#ffffff",
                        borderColor: "#d4d4d9",
                        borderWidth: 1,
                        textStyle: { color: "#171777", fontWeight: 700 },
                        formatter: p => `${esc(p.name)}<br>${moneyFmt(p.value, 0)} (${Number(p.percent).toFixed(0)}%)`
                    },
                    series: [
                        {
                            name: TITLE,
                            type: "pie",
                            radius: ["0%", "61%"],
                            center: ["50%", "39%"],
                            startAngle: 90,
                            minAngle: 1,
                            avoidLabelOverlap: true,
                            stillShowZeroSum: false,
                            selectedMode: false,
                            labelLine: {
                                length: 10,
                                length2: 8,
                                smooth: .25,
                                lineStyle: {
                                    color: "#09C698",
                                    width: 2
                                }
                            },
                            label: {
                                color: "#4f5470",
                                fontSize: 10,
                                fontWeight: 800,
                                formatter: params => `${params.name}\n${Number(params.percent).toFixed(0)}%`
                            },
                            itemStyle: {
                                borderRadius: 2
                            },
                            emphasis: {
                                scale: true,
                                scaleSize: 4,
                                itemStyle: {
                                    shadowBlur: 14,
                                    shadowOffsetY: 3,
                                    shadowColor: "rgba(23,23,119,.24)"
                                },
                                label: {
                                    fontWeight: 900
                                }
                            },
                            data: chartData
                        }
                    ]
                }, true);

                chart.resize();
                gotData = true;
            }

            function receive(source) {
                try {
                    const rows = findRows(source);

                    if (rows.length) {
                        renderPieRows(rows);
                        return;
                    }

                    if (gotData) return;

                    if (hasExplicitEmptyRows(source)) {
                        showNoData("no data");
                    }
                } catch (err) {
                    showError(err);
                }
            }

            showLoader("loading...");

            window.addEventListener("message", ev => {
                const data = ev && ev.data ? ev.data : {};
                const type = String(data.type || "");

                if (type.startsWith("dashboard-custom-html:") && type.endsWith(":resize")) {
                    if (chart) chart.resize();
                    return;
                }

                receive(data);
            });

            window.update = receive;
            window.init = receive;
            window.setData = receive;
            window.onData = receive;
            window.drawPie = receive;

            window.addEventListener("resize", () => {
                if (chart) chart.resize();
            });

            if (window.DashVisualContext) {
                receive(window.DashVisualContext);
            } else if (window.__DashVisualContext) {
                receive(window.__DashVisualContext);
            } else if (window.__DASH_VISUAL_CONTEXT__) {
                receive(window.__DASH_VISUAL_CONTEXT__);
            }
        })();
    </script>
</body>
</html>
