<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Host — DocChat Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230808ee'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial' font-weight='800' font-size='52' fill='white'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/site.css?v=20260726">
  <style>
    body {
      background: linear-gradient(135deg, #f4f6fb 0%, #e9edf5 100%);
      min-height: 100vh;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      color: #171777;
      margin: 0;
    }
    .topbar {
      background: linear-gradient(90deg, #212121 0%, #171777 100%);
      color: #fff;
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 14px rgba(23,23,119,0.18);
      position: sticky; top: 0; z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; font-weight: 800; font-size: 16px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #0808ee 0%, #09c698 100%);
      display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 800;
      box-shadow: 0 4px 12px rgba(8,8,238,0.4);
    }
    .topbar a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; transition: all 140ms ease; }
    .topbar a:hover { background: rgba(255,255,255,0.10); color: #fff; }

    .frame-wrap {
      max-width: 1480px;
      margin: 16px auto;
      padding: 0 24px 32px;
    }
    .frame-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #fff;
      border: 1px solid #d8deea;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 4px 14px rgba(23,23,119,0.08);
    }
    .frame-head .name { font-size: 14px; font-weight: 700; color: #171777; }
    .frame-head .sector {
      padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .sector.csr { background: rgba(9,198,152,0.12); color: #06a67f; }
    .sector.its { background: rgba(132,94,247,0.12); color: #6d28d9; }
    .frame-head .source { margin-left: auto; font-size: 11px; color: #60708b; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .frame-head .status {
      padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.7); border: 1px solid #d8deea; color: #60708b;
    }
    .frame-head .status.ok { background: rgba(16,185,129,0.12); color: #047857; border-color: rgba(16,185,129,0.3); }
    .frame-head .status.err { background: rgba(239,68,68,0.12); color: #b91c1c; border-color: rgba(239,68,68,0.3); }

    .frame-host {
      background: #fff;
      border: 1px solid #d8deea;
      border-top: 0;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 14px rgba(23,23,119,0.08);
      height: 720px;
      overflow: hidden;
      position: relative;
    }
    .frame-host iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.95);
      color: #60708b;
      font-size: 13px;
      font-weight: 600;
      gap: 10px;
      z-index: 10;
      transition: opacity 240ms ease;
    }
    .loading-overlay.is-hidden { opacity: 0; pointer-events: none; }
    .loading-overlay .spin {
      width: 24px; height: 24px;
      border: 3px solid #d8deea; border-top-color: #0808ee;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .foot {
      margin-top: 16px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid #d8deea;
      border-radius: 12px;
      font-size: 11px;
      color: #60708b;
      display: flex;
      justify-content: space-between;
    }
    .foot code {
      background: #eef0f8;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      color: #171777;
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="./visuals.html">
    <span class="brand-mark">D</span>
    DocChat · Visual Host
  </a>
  <div style="display:flex; gap:8px;">
    <a href="./visuals.html"><i class="fa-solid fa-arrow-left"></i> Gallery</a>
    <a href="https://github.com/insightanalyticsca/dashboards" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i></a>
  </div>
</header>

<div class="frame-wrap">
  <div class="frame-head">
    <span class="name" id="visName">…</span>
    <span class="sector" id="visSector">…</span>
    <span class="status" id="visStatus">loading</span>
    <span class="source" id="visSource">…</span>
  </div>
  <div class="frame-host">
    <div class="loading-overlay" id="loading">
      <span class="spin"></span>
      <span>Loading visual + data…</span>
    </div>
    <iframe id="visFrame" referrerpolicy="same-origin"></iframe>
  </div>
  <div class="foot">
    <span>Faithful clone: visual HTML is the original <code>wwwroot/custom-html/</code> file, verbatim. Data is posted via <code>postMessage</code> just like <code>Multi.cshtml</code>.</span>
    <span id="footMeta">—</span>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const name = (params.get('name') || '').trim();
  if (!name) {
    document.getElementById('loading').innerHTML = '<span style="color:#b91c1c;font-weight:700">Missing ?name= parameter</span>';
    return;
  }

  // Auto-detect sector: its-* = ITS, otherwise CSR
  const sector = name.toLowerCase().startsWith('its-') ? 'its' : 'csr';
  const visualUrl = './custom-html/' + name + '.html';
  const dataUrl = './data/' + sector + '/' + name + '.json';

  document.getElementById('visName').textContent = name;
  document.getElementById('visSector').textContent = sector;
  document.getElementById('visSector').className = 'sector ' + sector;
  document.getElementById('visSource').textContent = 'data/' + sector + '/' + name + '.json';
  document.title = name + ' — Visual Host';

  const frame = document.getElementById('visFrame');
  const loading = document.getElementById('loading');
  const statusEl = document.getElementById('visStatus');

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // Load the visual in the iframe
  frame.src = visualUrl;

  // Wait for iframe to load, then fetch data and post it
  frame.addEventListener('load', async () => {
    try {
      const res = await fetch(dataUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' on ' + dataUrl);
      const payload = await res.json();

      // Wait a tick to ensure the visual's message listener is registered
      await new Promise(r => setTimeout(r, 100));

      // Post the payload to the iframe. The visual's listener picks this up
      // via window.addEventListener('message', ...) and renders.
      // Type 'dashboard-custom-html:update' is handled by both CSR visuals
      // (aging-bankruptcies etc.) and ITS visuals (its-uptime etc.).
      frame.contentWindow.postMessage({
        type: 'dashboard-custom-html:update',
        data: payload.data || payload.rows || payload
      }, '*');

      // Also post the full payload for visuals that look for payload.payload etc.
      frame.contentWindow.postMessage({
        type: 'dashboard-custom-html:init',
        payload: payload
      }, '*');

      loading.classList.add('is-hidden');
      setStatus('rendered', 'ok');
      document.getElementById('footMeta').textContent =
        (payload.data ? payload.data.length : 0) + ' rows posted';
    } catch (err) {
      loading.innerHTML = '<span style="color:#b91c1c;font-weight:700">⚠ ' + err.message + '</span>';
      setStatus('error', 'err');
      console.error(err);
    }
  });

  frame.addEventListener('error', () => {
    loading.innerHTML = '<span style="color:#b91c1c;font-weight:700">Failed to load iframe: ' + visualUrl + '</span>';
    setStatus('iframe error', 'err');
  });
})();
</script>

</body>
</html>
